<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.json">
<title>AURA</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#0b0c0f;
  color:#e7e9ed;
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
main{width:min(92vw,620px)}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px
}
h1{
  margin:0;
  font-size:18px;
  font-weight:600;
  letter-spacing:.16em
}
#state{
  display:flex;
  align-items:center;
  gap:8px;
  color:#858b96;
  font-size:13px
}
#indicator{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4d525b
}
#indicator.active{background:#8aa2ff}
#conversation{
  padding:20px 0;
  border-top:1px solid #1d2026;
  border-bottom:1px solid #1d2026
}
#heard{
  min-height:22px;
  margin-bottom:14px;
  color:#858b96
}
#reply{
  min-height:50px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
#reply pre{
  margin:16px 0 0;
  padding:14px;
  overflow:auto;
  border:1px solid #20242c;
  border-radius:6px;
  background:#111318;
  font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace
}
footer{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px
}
button,select{
  padding:10px 14px;
  border:1px solid #30343c;
  border-radius:6px;
  background:#121419;
  color:#e7e9ed;
  font:inherit
}
button{cursor:pointer}
button:hover,select:hover{background:#181b21}
button.active{
  border-color:#536cae;
  background:#151b2b
}
#log{
  max-height:140px;
  margin-top:22px;
  overflow:auto;
  color:#686f7b;
  font-size:12px
}
#log p{margin:5px 0}
</style>
</head>

<body>

<main>

<header>
  <h1>AURA</h1>

  <div id="state">
    <span id="indicator"></span>
    <span id="status">Ready</span>
  </div>
</header>

<section id="conversation">

  <div id="heard">
    Say “AURA” to get my attention.
  </div>

  <div id="reply"></div>

</section>

<footer>

  <button id="listen">
    CONSTANT LISTENING: OFF
  </button>

  <select id="voice" aria-label="AURA voice">

    <option value="21m00Tcm4TlvDq8ikWAM">
      Rachel
    </option>

    <option value="EXAVITQu4vr4xnSDxMaL">
      Bella
    </option>

    <option value="ErXwobaYiN019PkySvjV">
      Antoni
    </option>

    <option value="TxGEqnHWrfWFTfGW9XjX">
      Josh
    </option>

    <option value="VR6AewLTigWG4xSOukaG">
      Arnold
    </option>

  </select>

</footer>

<div id="log"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

const SUPABASE_URL =
  "https://tvxugmumfvgnvjacwwfz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1mPqnw9hx5Vm0O_o4O_fsg_96YAhDuY";

const AURA_FUNCTION =
  SUPABASE_URL + "/functions/v1/aura-v2";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const statusEl =
  document.getElementById("status");

const indicatorEl =
  document.getElementById("indicator");

const heardEl =
  document.getElementById("heard");

const replyEl =
  document.getElementById("reply");

const logEl =
  document.getElementById("log");

const listenBtn =
  document.getElementById("listen");

const voiceEl =
  document.getElementById("voice");

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let constantListening = false;
let waitingForWake = true;
let busy = false;
let speaking = false;
let wakeTimer = null;


function status(text,active=false){
  statusEl.textContent = text;
  indicatorEl.classList.toggle(
    "active",
    active
  );
}


function log(source,text){
  const p = document.createElement("p");
  p.textContent = source + ": " + text;
  logEl.prepend(p);
}


function render(text){
  replyEl.textContent = "";

  const parts =
    String(text).split(
      /(```[\s\S]*?```)/g
    );

  for(const part of parts){

    if(
      part.startsWith("```") &&
      part.endsWith("```")
    ){

      const code =
        part
          .replace(/^```[^\n]*\n?/,"")
          .replace(/```$/,"");

      const pre =
        document.createElement("pre");

      const codeEl =
        document.createElement("code");

      codeEl.textContent = code;
      pre.appendChild(codeEl);
      replyEl.appendChild(pre);

    }else if(part.trim()){

      const span =
        document.createElement("span");

      span.textContent = part;
      replyEl.appendChild(span);
    }
  }
}


async function session(){

  let {
    data:{session}
  } = await client.auth.getSession();

  if(session) return session;

  const result =
    await client.auth.signInAnonymously();

  if(result.error){
    throw result.error;
  }

  return result.data.session;
}


async function playAudio(
  audioData,
  audioType="audio/mpeg"
){

  if(!audioData){
    throw new Error(
      "AURA returned no voice audio."
    );
  }

  const bytes =
    Uint8Array.from(
      atob(audioData),
      c => c.charCodeAt(0)
    );

  const blob =
    new Blob(
      [bytes],
      {type:audioType}
    );

  const url =
    URL.createObjectURL(blob);

  const audio =
    new Audio(url);

  speaking = true;

  status(
    "Speaking",
    true
  );

  try{

    await audio.play();

    await new Promise(
      resolve => {
        audio.onended = resolve;
        audio.onerror = resolve;
      }
    );

  }finally{

    URL.revokeObjectURL(url);
    speaking = false;
  }
}


async function ask(message){

  if(
    busy ||
    speaking ||
    !message.trim()
  ){
    return;
  }

  busy = true;
  waitingForWake = false;

  clearTimeout(wakeTimer);

  try{
    recognition?.stop();
  }catch(_){}

  status(
    "Thinking",
    true
  );

  heardEl.textContent =
    "You: " + message;

  replyEl.textContent = "";

  log(
    "YOU",
    message
  );

  try{

    const s =
      await session();

    if(!s){
      throw new Error(
        "AURA could not authenticate."
      );
    }

    const response =
      await fetch(
        AURA_FUNCTION,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              s.access_token,

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({
            message:message,
            voiceId:voiceEl.value
          })
        }
      );

    let data;

    try{
      data = await response.json();
    }catch(_){
      throw new Error(
        "AURA returned an invalid response."
      );
    }

    if(!response.ok){

      throw new Error(
        data.error ||
        "AURA request failed."
      );
    }

    if(data.text){
      render(data.text);

      log(
        "AURA",
        data.text
      );
    }

    /*
     * The SAME aura-v2 request provides
     * the ElevenLabs audio.
     */
    if(data.audio){

      await playAudio(
        data.audio,
        data.audioType ||
        "audio/mpeg"
      );

    }else{

      throw new Error(
        "AURA replied without audio."
      );
    }

  }catch(error){

    status(
      "Error"
    );

    replyEl.textContent =
      error.message;

    log(
      "ERROR",
      error.message
    );

  }finally{

    busy = false;

    if(
      constantListening &&
      !speaking
    ){

      waitingForWake = true;

      status(
        "Listening",
        true
      );

      setTimeout(
        startListening,
        250
      );
    }else if(!constantListening){

      status(
        "Ready"
      );
    }
  }
}


function handleSpeech(
  transcript
){

  const text =
    transcript.trim();

  if(!text)return;

  /*
   * Already awake:
   * the next sentence is the command.
   */
  if(!waitingForWake){

    ask(text);
    return;
  }

  /*
   * Wake phrase can be:
   *
   * AURA
   * Hey AURA
   * Yo AURA
   * Okay AURA
   */
  const match =
    text.match(
      /^(?:(?:hey|yo|okay|ok)\s+)?aura\b[\s,:-]*(.*)$/i
    );

  if(!match)return;

  const command =
    match[1].trim();

  waitingForWake = false;

  if(command){

    ask(command);

  }else{

    heardEl.textContent =
      "AURA is listening…";

    status(
      "Listening",
      true
    );

    clearTimeout(wakeTimer);

    wakeTimer =
      setTimeout(
        ()=>{
          if(
            waitingForWake === false &&
            !busy &&
            !speaking
          ){
            waitingForWake = true;

            heardEl.textContent =
              "Say “AURA” to get my attention.";
          }
        },
        5000
      );
  }
}


function startListening(){

  if(
    !constantListening ||
    busy ||
    speaking ||
    !recognition
  ){
    return;
  }

  try{
    recognition.start();
  }catch(_){}
}


if(!Recognition){

  status(
    "Speech recognition unavailable"
  );

  listenBtn.disabled = true;

}else{

  recognition =
    new Recognition();

  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  recognition.onstart = ()=>{

    status(
      "Listening",
      true
    );
  };

  recognition.onresult =
    event => {

      let finalText = "";
      let interim = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        const result =
          event.results[i];

        const transcript =
          result[0].transcript;

        if(result.isFinal){

          finalText += transcript;

        }else{

          interim += transcript;
        }
      }

      if(
        interim &&
        !busy &&
        !speaking
      ){

        heardEl.textContent =
          interim;
      }

      if(finalText){

        handleSpeech(
          finalText
        );
      }
    };

  recognition.onerror =
    event => {

      if(
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ){

        constantListening = false;

        listenBtn.textContent =
          "CONSTANT LISTENING: OFF";

        listenBtn.classList.remove(
          "active"
        );

        status(
          "Microphone permission required"
        );

        return;
      }

      if(constantListening){

        setTimeout(
          startListening,
          500
        );
      }
    };

  recognition.onend = ()=>{

    if(
      constantListening &&
      !busy &&
      !speaking
    ){

      setTimeout(
        startListening,
        200
      );
    }
  };
}


listenBtn.onclick =
  async()=>{

    if(!constantListening){

      try{

        await session();

        constantListening = true;
        waitingForWake = true;

        listenBtn.textContent =
          "CONSTANT LISTENING: ON";

        listenBtn.classList.add(
          "active"
        );

        heardEl.textContent =
          "Say “AURA” to get my attention.";

        status(
          "Listening",
          true
        );

        startListening();

      }catch(error){

        status(
          "Authentication failed"
        );

        log(
          "ERROR",
          error.message
        );
      }

    }else{

      constantListening = false;
      waitingForWake = true;
      busy = false;

      clearTimeout(
        wakeTimer
      );

      try{
        recognition?.stop();
      }catch(_){}

      listenBtn.textContent =
        "CONSTANT LISTENING: OFF";

      listenBtn.classList.remove(
        "active"
      );

      status(
        "Ready"
      );

      heardEl.textContent =
        "Say “AURA” to get my attention.";
    }
  };


session().catch(
  error => log(
    "AUTH",
    error.message
  )
);

</script>

</body>
</html>
