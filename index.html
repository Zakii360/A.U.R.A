<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f3ef">
<title>AURA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #f4f3ef;
  color: #1c1c1c;
  font-family: 'Didact Gothic', sans-serif;
}

body {
  display: flex;
  min-height: 100vh;
}

nav {
  width: 160px;
  flex-shrink: 0;
  background: #eae9e4;
  border-right: 1px solid #d8d6d0;
  display: flex;
  flex-direction: column;
  padding: 22px 14px;
  gap: 20px;
}

.mark {
  font-size: 10px;
  letter-spacing: .22em;
  color: #aaa;
  text-transform: uppercase;
}

.conn {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pip-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.pip {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ccc;
  flex-shrink: 0;
  transition: background .3s;
}
.pip.on  { background: #4a8c5c; }
.pip.err { background: #9b4040; }

.pip-label {
  font-size: 11px;
  color: #999;
}

input {
  font-family: 'Didact Gothic', sans-serif;
  background: #f4f3ef;
  border: 1px solid #d8d6d0;
  border-radius: 2px;
  color: #1c1c1c;
  font-size: 11px;
  padding: 5px 7px;
  width: 100%;
  outline: none;
}
input::placeholder { color: #bbb; }
input:focus { border-color: #aaa; }

button {
  font-family: 'Didact Gothic', sans-serif;
  background: transparent;
  border: 1px solid #d8d6d0;
  border-radius: 2px;
  color: #999;
  font-size: 11px;
  padding: 5px 8px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: color .15s, border-color .15s;
}
button:hover { color: #1c1c1c; border-color: #aaa; }
button.on { color: #1c1c1c; border-color: #aaa; }
button:disabled { opacity: .3; cursor: default; }

.spacer { flex: 1; }

select {
  font-family: 'Didact Gothic', sans-serif;
  background: #f4f3ef;
  border: 1px solid #d8d6d0;
  border-radius: 2px;
  color: #1c1c1c;
  font-size: 11px;
  padding: 5px 7px;
  width: 100%;
  outline: none;
  cursor: pointer;
}
select option { background: #f4f3ef; }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 44px 52px;
  max-width: 680px;
}

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
}

.status {
  font-size: 11px;
  color: #aaa;
  letter-spacing: .04em;
}

.mic {
  display: flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  border: 1px solid #d8d6d0;
  border-radius: 2px;
  color: #aaa;
  font-family: 'Didact Gothic', sans-serif;
  font-size: 11px;
  padding: 6px 12px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  width: auto;
  text-align: left;
}
.mic:hover { color: #1c1c1c; border-color: #aaa; }
.mic.on { color: #1c1c1c; border-color: #aaa; }
.mic svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }

.heard {
  font-size: 12px;
  color: #bbb;
  min-height: 18px;
  margin-bottom: 18px;
}

.reply {
  font-size: 21px;
  line-height: 1.65;
  color: #1c1c1c;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.reply pre {
  margin-top: 16px;
  padding: 12px 14px;
  background: #eae9e4;
  border: 1px solid #d8d6d0;
  border-radius: 2px;
  font-size: 12px;
  font-family: ui-monospace, monospace;
  overflow-x: auto;
  color: #888;
}

.empty { font-size: 14px; color: #ccc; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: #d8d6d0; }
</style>
</head>
<body>

<nav>
  <div class="mark">AURA</div>

  <div class="conn">
    <div class="pip-row">
      <span class="pip" id="pip"></span>
      <span class="pip-label" id="pipLabel">Not connected</span>
    </div>
    <input id="urlIn" type="text" placeholder="https://xyz.supabase.co" autocomplete="off" spellcheck="false">
    <button id="saveBtn">Connect</button>
  </div>

  <div class="spacer"></div>

  <select id="voiceSel"></select>
  <button id="autoBtn">Auto pitch: on</button>
</nav>

<main>
  <div class="bar">
    <span class="status" id="st">Ready</span>
    <button class="mic" id="micBtn">
      <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      Mic off
    </button>
  </div>

  <div class="heard" id="heard"></div>
  <div class="reply" id="reply"><span class="empty">Connect a project, turn on the mic, say "AURA".</span></div>
</main>

<script>
const SLUG = "aura-v3";

let url      = localStorage.getItem("aura_url") || "";
let listening = false, waiting = true, busy = false, speaking = false;
let wakeTimer = null, autoPitch = true, voices = [];
const conv = [];
const prefs = { rate: .94, pitch: .98, volume: 1 };

const $pip   = document.getElementById("pip");
const $label = document.getElementById("pipLabel");
const $urlIn = document.getElementById("urlIn");
const $save  = document.getElementById("saveBtn");
const $st    = document.getElementById("st");
const $heard = document.getElementById("heard");
const $reply = document.getElementById("reply");
const $mic   = document.getElementById("micBtn");
const $auto  = document.getElementById("autoBtn");
const $voice = document.getElementById("voiceSel");

if (url) { $urlIn.value = url; probe(); }

function pip(s) {
  $pip.className = "pip" + (s === "on" ? " on" : s === "err" ? " err" : "");
  $label.textContent = s === "on" ? (url.replace("https://","").split(".")[0]) : s === "err" ? "Unreachable" : "Not connected";
}

async function probe() {
  if (!url) return;
  try {
    const r = await fetch(url + "/functions/v1/" + SLUG, { method: "OPTIONS" });
    pip(r.ok || r.status === 204 ? "on" : "err");
  } catch { pip("err"); }
}

$save.onclick = async () => {
  const v = $urlIn.value.trim().replace(/\/$/, "");
  if (!v) return;
  url = v;
  localStorage.setItem("aura_url", v);
  $save.textContent = "Checking…";
  $save.disabled = true;
  await probe();
  $save.textContent = "Connect";
  $save.disabled = false;
};

function render(text) {
  $reply.textContent = "";
  String(text).split(/(```[\s\S]*?```)/g).forEach(p => {
    if (p.startsWith("```") && p.endsWith("```")) {
      const pre = document.createElement("pre");
      pre.textContent = p.replace(/^```[^\n]*\n?/, "").replace(/```$/, "");
      $reply.appendChild(pre);
    } else if (p.trim()) {
      $reply.appendChild(Object.assign(document.createElement("span"), { textContent: p }));
    }
  });
}

function toSpeech(t) {
  return t.replace(/```[\s\S]*?```/g, "I've displayed the code.")
          .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
          .replace(/[*_~`#>]/g, "")
          .replace(/\b(API|JSON|HTML|CSS|URL|SQL|JWT|UUID)\b/gi, m => m.split("").join(" "))
          .replace(/—/g, ", ").replace(/\s+/g, " ").trim();
}

function speak(text, apd) {
  return new Promise(r => {
    const s = toSpeech(text);
    if (!s) { r(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    const idx = Number($voice.value);
    const all = speechSynthesis.getVoices();
    if (Number.isInteger(idx) && all[idx]) u.voice = all[idx];
    let { rate, pitch, volume } = prefs;
    if (autoPitch && apd) {
      if (isFinite(+apd.rate))   rate   = Math.min(1.15, Math.max(.75, +apd.rate));
      if (isFinite(+apd.pitch))  pitch  = Math.min(1.4,  Math.max(.6,  +apd.pitch));
      if (isFinite(+apd.volume)) volume = Math.min(1,    Math.max(.7,  +apd.volume));
    }
    u.rate = rate; u.pitch = pitch; u.volume = volume;
    speaking = true; $st.textContent = "Speaking";
    u.onend = u.onerror = () => { speaking = false; r(); };
    speechSynthesis.speak(u);
  });
}

async function ask(text) {
  if (busy || speaking || !text.trim()) return;
  if (!url) { $reply.textContent = "No project connected."; return; }

  busy = true; waiting = false;
  clearTimeout(wakeTimer);
  try { recog?.stop(); } catch(_) {}

  $st.textContent = "Thinking";
  $heard.textContent = text;
  $reply.innerHTML = "";

  try {
    const res = await fetch(url + "/functions/v1/" + SLUG, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: conv.slice(-12), preferences: prefs }),
    });
    let d;
    try { d = await res.json(); } catch { throw new Error("Bad response."); }
    if (!res.ok) throw new Error(d.error || "HTTP " + res.status);
    if (!d.text) throw new Error("Empty response.");
    conv.push({ role: "user", content: text }, { role: "assistant", content: d.text });
    if (conv.length > 24) conv.splice(0, conv.length - 24);
    render(d.text);
    await speak(d.spoken || d.text, d.pitch);
  } catch(e) {
    $reply.textContent = e.message;
    $st.textContent = "Error";
    pip("err");
  } finally {
    busy = false;
    if (url) pip("on");
    if (listening && !speaking) { waiting = true; $st.textContent = "Listening"; setTimeout(go, 200); }
    else $st.textContent = "Ready";
  }
}

function heard(text) {
  text = text.trim();
  if (!text || busy || speaking) return;
  if (!waiting) { ask(text); return; }
  const m = text.match(/^(?:(?:hey|ok|okay|yo)\s+)?aura\b[\s,:-]*(.*)?$/i);
  if (!m) return;
  waiting = false;
  const cmd = (m[1] || "").trim();
  if (cmd) { ask(cmd); return; }
  $heard.textContent = "Listening…";
  $st.textContent = "Listening";
  clearTimeout(wakeTimer);
  wakeTimer = setTimeout(() => { if (!busy && !speaking) { waiting = true; $heard.textContent = ""; } }, 5000);
}

const Recog = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
if (Recog) {
  recog = new Recog();
  recog.continuous = true; recog.interimResults = true; recog.lang = "en-US";
  recog.onresult = e => {
    let fin = "", tmp = "";
    for (let i = e.resultIndex; i < e.results.length; i++)
      e.results[i].isFinal ? (fin += e.results[i][0].transcript) : (tmp += e.results[i][0].transcript);
    if (tmp && !busy && !speaking) $heard.textContent = tmp;
    if (fin) heard(fin);
  };
  recog.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false; micLabel(); $st.textContent = "Mic denied"; return;
    }
    if (listening) setTimeout(go, 500);
  };
  recog.onend = () => { if (listening && !busy && !speaking) setTimeout(go, 200); };
} else { $mic.disabled = true; }

function go() {
  if (!recog || !listening || busy || speaking) return;
  try { recog.start(); } catch(e) {
    if (!String(e.message).includes("already started"))
      setTimeout(() => { if (listening && !busy && !speaking) go(); }, 300);
  }
}

function micLabel() {
  $mic.classList.toggle("on", listening);
  $mic.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Mic ${listening ? "on" : "off"}`;
}

$mic.onclick = () => {
  listening = !listening; waiting = true; micLabel();
  if (listening) { $st.textContent = "Listening"; $heard.textContent = ""; go(); }
  else { speechSynthesis.cancel(); clearTimeout(wakeTimer); try { recog?.stop(); } catch(_) {} $st.textContent = "Ready"; $heard.textContent = ""; }
};

$auto.onclick = () => { autoPitch = !autoPitch; $auto.textContent = "Auto pitch: " + (autoPitch ? "on" : "off"); $auto.classList.toggle("on", autoPitch); };
$auto.classList.add("on");

function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v?.name);
  const en = voices.filter(v => /^en/i.test(v.lang));
  const list = en.length ? en : voices;
  $voice.innerHTML = "";
  if (!list.length) { $voice.innerHTML = "<option>No voices</option>"; return; }
  list.forEach(v => {
    const o = document.createElement("option");
    o.value = String(voices.indexOf(v)); o.textContent = v.name;
    $voice.appendChild(o);
  });
  const p = list.findIndex(v => /zira|google us english/i.test(v.name));
  if (p >= 0) $voice.value = String(voices.indexOf(list[p]));
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 400);
setTimeout(loadVoices, 1200);
</script>
</body>
</html>
