<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>A.U.R.A</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#0b0c0f;
  --surface:#101217;
  --border:#20232a;
  --text:#e5e7eb;
  --muted:#858b96;
  --dim:#555b65;
  --accent:#8aa2ff
}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  grid-template-columns:260px 1fr;
  background:var(--bg);
  color:var(--text);
  font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
aside{
  border-right:1px solid var(--border);
  padding:28px 22px;
  display:flex;
  flex-direction:column;
  min-height:100vh
}
.wordmark{
  font-size:17px;
  font-weight:600;
  letter-spacing:.18em;
  margin-bottom:42px
}
.section{margin-bottom:30px}
.label{
  color:var(--dim);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:9px
}
.btn,.field,.project-select,.voice-sel{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:4px;
  font:inherit
}
.btn{
  padding:9px 11px;
  cursor:pointer;
  text-align:left
}
.btn:hover,.btn.on{
  border-color:#39425a;
  background:#151821
}
.btn:disabled{
  opacity:.45;
  cursor:default
}
.project-row{
  display:flex;
  align-items:center;
  gap:8px
}
.project-select,.voice-sel{
  padding:9px 10px;
  cursor:pointer
}
.pip{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#454a52;
  flex:none
}
.pip.live{background:#8aa2ff}
.pip.err{background:#b56d6d}
.conn-note{
  margin-top:9px;
  color:var(--dim);
  font-size:11px;
  line-height:1.5
}
.bottom{
  margin-top:auto
}
main{
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding:28px 42px
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center
}
.status-text{
  color:var(--muted);
  font-size:12px
}
.mic-btn{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  border-radius:4px;
  padding:8px 11px;
  cursor:pointer
}
.mic-btn.on{
  color:var(--text);
  border-color:#39425a
}
.mic-btn svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.5
}
.heard{
  margin-top:18vh;
  color:var(--muted);
  min-height:22px
}
.reply{
  margin-top:12px;
  max-width:720px;
  font-size:18px;
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.reply pre{
  margin-top:16px;
  padding:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
  overflow:auto;
  color:var(--muted);
  white-space:pre
}
.idle{
  color:var(--dim);
  font-size:14px
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>

<body>

<aside>

  <div class="wordmark">AURA</div>

  <div class="section">

    <div class="label">Supabase</div>

    <button
      class="btn"
      id="loadBtn"
      type="button"
    >
      Load projects
    </button>

    <div
      class="conn-note"
      id="connNote"
    >
      Connect through AURA's backend.
    </div>

  </div>


  <div class="section">

    <div class="label">Project</div>

    <div class="project-row">

      <span
        class="pip"
        id="pip"
      ></span>

      <select
        class="project-select"
        id="projectSelect"
        disabled
      >
        <option value="">
          — none —
        </option>
      </select>

    </div>

  </div>


  <div class="bottom">

    <div class="label">Voice</div>

    <select
      class="voice-sel"
      id="voiceSelect"
    ></select>

    <button
      class="btn"
      id="autoBtn"
      type="button"
      style="margin-top:8px"
    >
      Auto pitch: on
    </button>

  </div>

</aside>


<main>

  <div class="top-bar">

    <span
      class="status-text"
      id="statusText"
    >
      Ready
    </span>

    <button
      class="mic-btn"
      id="micBtn"
      type="button"
    >
      <svg viewBox="0 0 24 24">
        <rect
          x="9"
          y="2"
          width="6"
          height="13"
          rx="3"
        />
        <path d="M5 10a7 7 0 0014 0"/>
        <line
          x1="12"
          y1="19"
          x2="12"
          y2="23"
        />
        <line
          x1="8"
          y1="23"
          x2="16"
          y2="23"
        />
      </svg>
      Mic off
    </button>

  </div>


  <div
    class="heard"
    id="heard"
  ></div>


  <div
    class="reply"
    id="reply"
  >
    <span class="idle">
      Connect a project and turn on the mic.
    </span>
  </div>

</main>


<script>
const SUPABASE_PROJECT =
  "tvxugmumfvgnvjacwwfz";

const AURA_URL =
  "https://" +
  SUPABASE_PROJECT +
  ".supabase.co/functions/v1/aura-v3";


/*
 * This is only the public/publishable key.
 * No Supabase Management token belongs here.
 */
const AURA_KEY =
  "sb_publishable_1mPqnw9hx5Vm0O_o4O_fsg_96YAhDuY";


let projects = [];
let activeProject = null;
let connected = false;

let recognition = null;
let listening = false;
let waiting = true;
let busy = false;
let speaking = false;
let wakeTimer = null;

let autoPitchOn = true;
let voices = [];

const conversation = [];

const prefs = {
  rate:.94,
  pitch:.98,
  volume:1
};


const $loadBtn =
  document.getElementById("loadBtn");

const $note =
  document.getElementById("connNote");

const $projSel =
  document.getElementById("projectSelect");

const $pip =
  document.getElementById("pip");

const $status =
  document.getElementById("statusText");

const $heard =
  document.getElementById("heard");

const $reply =
  document.getElementById("reply");

const $micBtn =
  document.getElementById("micBtn");

const $autoBtn =
  document.getElementById("autoBtn");

const $voiceSel =
  document.getElementById("voiceSelect");


function setPip(state){

  $pip.className =
    "pip" +
    (
      state === "live"
        ? " live"
        : state === "err"
          ? " err"
          : ""
    );
}


function setStatus(text){

  $status.textContent =
    text;
}


function setNote(text){

  $note.textContent =
    text;
}


/*
 * IMPORTANT:
 * This request goes to AURA, NOT
 * api.supabase.com.
 */
async function mgmt(
  path,
  options = {}
){

  const response =
    await fetch(
      AURA_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "apikey":
            AURA_KEY
        },

        body:JSON.stringify({

          action:
            "supabase_management",

          path,

          method:
            options.method ||
            "GET",

          body:
            options.body ??
            null
        })
      }
    );


  let data;

  try{
    data =
      await response.json();
  }catch(_){

    throw new Error(
      "AURA returned an invalid response."
    );
  }


  if(!response.ok){

    throw new Error(
      data.error ||
      "Supabase management request failed."
    );
  }


  return data.data;
}


$loadBtn.onclick =
  async () => {

    $loadBtn.disabled =
      true;

    $loadBtn.textContent =
      "Loading…";

    setNote(
      "Loading Supabase projects…"
    );

    setPip("");


    try{

      projects =
        await mgmt(
          "/v1/projects"
        );


      if(!Array.isArray(projects)){

        throw new Error(
          "Supabase returned an unexpected project list."
        );
      }


      $projSel.innerHTML =
        '<option value="">— select —</option>';


      projects.forEach(
        project => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            project.id;

          option.textContent =
            project.name ||
            project.id;

          $projSel.appendChild(
            option
          );
        }
      );


      $projSel.disabled =
        false;


      setNote(
        projects.length +
        " project" +
        (
          projects.length !== 1
            ? "s"
            : ""
        ) +
        " loaded."
      );


      const saved =
        localStorage.getItem(
          "aura_project"
        );


      if(
        saved &&
        projects.some(
          p =>
            p.id === saved
        )
      ){

        $projSel.value =
          saved;

        await activateProject(
          saved
        );
      }

    }catch(error){

      setPip("err");

      setNote(
        error.message
      );

    }finally{

      $loadBtn.disabled =
        false;

      $loadBtn.textContent =
        "Load projects";
    }
  };


async function activateProject(
  id
){

  if(!id){

    connected =
      false;

    activeProject =
      null;

    setPip("");

    return;
  }


  setPip("");

  setNote(
    "Connecting…"
  );


  try{

    const detail =
      await mgmt(
        "/v1/projects/" +
        encodeURIComponent(id)
      );


    const keysData =
      await mgmt(
        "/v1/projects/" +
        encodeURIComponent(id) +
        "/api-keys"
      );


    const anonKey =
      Array.isArray(keysData)
        ? (
            keysData.find(
              key =>
                key.name ===
                "anon"
            )?.api_key ||
            ""
          )
        : "";


    if(!anonKey){

      throw new Error(
        "No anon key found for this project."
      );
    }


    activeProject =
      detail;

    connected =
      true;


    setPip(
      "live"
    );


    setNote(
      detail.name ||
      detail.id
    );


    localStorage.setItem(
      "aura_project",
      id
    );


    /*
     * AURA itself remains connected to
     * the fixed AURA project. The selected
     * project is context for management
     * operations.
     */
    activeProject.anonKey =
      anonKey;

  }catch(error){

    connected =
      false;

    setPip(
      "err"
    );

    setNote(
      error.message
    );
  }
}


$projSel.onchange =
  () =>
    activateProject(
      $projSel.value
    );


function render(text){

  $reply.textContent =
    "";

  const parts =
    String(text)
      .split(
        /(```[\s\S]*?```)/g
      );


  for(
    const part of parts
  ){

    if(
      part.startsWith("```") &&
      part.endsWith("```")
    ){

      const pre =
        document.createElement(
          "pre"
        );

      pre.textContent =
        part
          .replace(
            /^```[^\n]*\n?/,
            ""
          )
          .replace(
            /```$/,
            ""
          );

      $reply.appendChild(
        pre
      );

    }else if(
      part.trim()
    ){

      const span =
        document.createElement(
          "span"
        );

      span.textContent =
        part;

      $reply.appendChild(
        span
      );
    }
  }
}


function toSpeech(text){

  return String(text)

    .replace(
      /```[\s\S]*?```/g,
      "I've outputted the code."
    )

    .replace(
      /\[([^\]]+)\]\([^)]*\)/g,
      "$1"
    )

    .replace(
      /[*_~`#>]/g,
      ""
    )

    .replace(
      /\b(API|JSON|HTML|CSS|URL|SQL|JWT|UUID)\b/gi,
      match =>
        match
          .split("")
          .join(" ")
    )

    .replace(
      /\bOrbitOS\b/gi,
      "Orbit O S"
    )

    .replace(
      /—/g,
      ", "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();
}


function speak(
  text,
  autoPitchData
){

  return new Promise(
    resolve => {

      const clean =
        toSpeech(text);


      if(!clean){

        resolve();

        return;
      }


      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          clean
        );


      const all =
        speechSynthesis.getVoices();


      const index =
        Number(
          $voiceSel.value
        );


      if(
        Number.isInteger(index) &&
        all[index]
      ){

        utterance.voice =
          all[index];
      }


      let rate =
        prefs.rate;

      let pitch =
        prefs.pitch;

      let volume =
        prefs.volume;


      if(
        autoPitchOn &&
        autoPitchData
      ){

        if(
          Number.isFinite(
            +autoPitchData.rate
          )
        ){

          rate =
            Math.min(
              1.15,
              Math.max(
                .75,
                +autoPitchData.rate
              )
            );
        }


        if(
          Number.isFinite(
            +autoPitchData.pitch
          )
        ){

          pitch =
            Math.min(
              1.40,
              Math.max(
                .60,
                +autoPitchData.pitch
              )
            );
        }


        if(
          Number.isFinite(
            +autoPitchData.volume
          )
        ){

          volume =
            Math.min(
              1,
              Math.max(
                .70,
                +autoPitchData.volume
              )
            );
        }
      }


      utterance.rate =
        rate;

      utterance.pitch =
        pitch;

      utterance.volume =
        volume;


      speaking =
        true;

      setStatus(
        "Speaking"
      );


      utterance.onend =
        () => {

          speaking =
            false;

          resolve();
        };


      utterance.onerror =
        () => {

          speaking =
            false;

          resolve();
        };


      speechSynthesis.speak(
        utterance
      );
    }
  );
}


async function ask(
  text
){

  if(
    busy ||
    speaking ||
    !text.trim()
  ){

    return;
  }


  busy =
    true;

  waiting =
    false;


  clearTimeout(
    wakeTimer
  );


  try{
    recognition?.stop();
  }catch(_){}


  setStatus(
    "Thinking"
  );


  $heard.textContent =
    text;

  $reply.innerHTML =
    "";


  try{

    const response =
      await fetch(
        AURA_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              AURA_KEY
          },

          body:JSON.stringify({

            message:text,

            history:
              conversation
                .slice(-12),

            preferences:prefs,

            project:
              activeProject
                ? {
                    id:
                      activeProject.id,

                    name:
                      activeProject.name
                  }
                : null
          })
        }
      );


    let data;

    try{

      data =
        await response.json();

    }catch(_){

      throw new Error(
        "AURA returned an invalid response."
      );
    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "AURA request failed."
      );
    }


    if(!data.text){

      throw new Error(
        "AURA returned no response."
      );
    }


    conversation.push(
      {
        role:"user",
        content:text
      },
      {
        role:"assistant",
        content:data.text
      }
    );


    if(
      conversation.length >
      24
    ){

      conversation.splice(
        0,
        conversation.length - 24
      );
    }


    render(
      data.text
    );


    await speak(
      data.spoken ||
      data.text,
      data.pitch
    );


  }catch(error){

    $reply.textContent =
      error.message;

    setStatus(
      "Error"
    );

    setPip(
      "err"
    );

  }finally{

    busy =
      false;


    if(
      listening &&
      !speaking
    ){

      waiting =
        true;

      setStatus(
        "Listening"
      );

      setTimeout(
        startListening,
        200
      );

    }else{

      setStatus(
        "Ready"
      );
    }
  }
}


function onSpeech(
  text
){

  text =
    text.trim();


  if(
    !text ||
    busy ||
    speaking
  ){

    return;
  }


  if(!waiting){

    ask(text);

    return;
  }


  const match =
    text.match(
      /^(?:(?:hey|ok|okay|yo)\s+)?aura\b[\s,:-]*(.*)?$/i
    );


  if(!match){

    return;
  }


  waiting =
    false;


  const command =
    (
      match[1] ||
      ""
    ).trim();


  if(command){

    ask(command);

    return;
  }


  $heard.textContent =
    "Listening…";


  setStatus(
    "Listening"
  );


  clearTimeout(
    wakeTimer
  );


  wakeTimer =
    setTimeout(
      () => {

        if(
          !busy &&
          !speaking
        ){

          waiting =
            true;

          $heard.textContent =
            "";
        }

      },
      5000
    );
}


const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(Recognition){

  recognition =
    new Recognition();

  recognition.continuous =
    true;

  recognition.interimResults =
    true;

  recognition.lang =
    "en-US";


  recognition.onresult =
    event => {

      let finalText =
        "";

      let interim =
        "";


      for(
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ){

        if(
          event.results[i].isFinal
        ){

          finalText +=
            event.results[i][0]
              .transcript;

        }else{

          interim +=
            event.results[i][0]
              .transcript;
        }
      }


      if(
        interim &&
        !busy &&
        !speaking
      ){

        $heard.textContent =
          interim;
      }


      if(finalText){

        onSpeech(
          finalText
        );
      }
    };


  recognition.onerror =
    event => {

      if(
        event.error ===
          "not-allowed" ||
        event.error ===
          "service-not-allowed"
      ){

        listening =
          false;

        updateMic();

        setStatus(
          "Mic permission denied"
        );

        return;
      }


      if(listening){

        setTimeout(
          startListening,
          500
        );
      }
    };


  recognition.onend =
    () => {

      if(
        listening &&
        !busy &&
        !speaking
      ){

        setTimeout(
          startListening,
          200
        );
      }
    };

}else{

  $micBtn.disabled =
    true;

  $micBtn.lastChild.textContent =
    " Not supported";
}


function startListening(){

  if(
    !recognition ||
    !listening ||
    busy ||
    speaking
  ){

    return;
  }


  try{

    recognition.start();

  }catch(error){

    if(
      !String(
        error.message
      ).includes(
        "already started"
      )
    ){

      setTimeout(
        () => {

          if(
            listening &&
            !busy &&
            !speaking
          ){

            startListening();
          }

        },
        300
      );
    }
  }
}


function updateMic(){

  $micBtn.classList.toggle(
    "on",
    listening
  );


  $micBtn.innerHTML =
    `<svg viewBox="0 0 24 24">
      <rect x="9" y="2" width="6" height="13" rx="3"/>
      <path d="M5 10a7 7 0 0014 0"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg> Mic ${
      listening
        ? "on"
        : "off"
    }`;
}


$micBtn.onclick =
  () => {

    listening =
      !listening;

    waiting =
      true;

    updateMic();


    if(listening){

      setStatus(
        "Listening"
      );

      $heard.textContent =
        "";

      startListening();

    }else{

      speechSynthesis.cancel();

      clearTimeout(
        wakeTimer
      );


      try{
        recognition?.stop();
      }catch(_){}


      setStatus(
        "Ready"
      );

      $heard.textContent =
        "";
    }
  };


$autoBtn.onclick =
  () => {

    autoPitchOn =
      !autoPitchOn;


    $autoBtn.textContent =
      "Auto pitch: " +
      (
        autoPitchOn
          ? "on"
          : "off"
      );


    $autoBtn.classList.toggle(
      "on",
      autoPitchOn
    );
  };


$autoBtn.classList.add(
  "on"
);


function loadVoices(){

  voices =
    speechSynthesis
      .getVoices()
      .filter(
        voice =>
          voice?.name
      );


  $voiceSel.innerHTML =
    "";


  const english =
    voices.filter(
      voice =>
        /^en/i.test(
          voice.lang
        )
    );


  const list =
    english.length
      ? english
      : voices;


  if(!list.length){

    $voiceSel.innerHTML =
      "<option>No voices</option>";

    return;
  }


  list.forEach(
    voice => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(
          voices.indexOf(
            voice
          )
        );

      option.textContent =
        voice.name;

      $voiceSel.appendChild(
        option
      );
    }
  );


  const preferred =
    list.findIndex(
      voice =>
        /zira|google us english/i
          .test(
            voice.name
          )
    );


  if(preferred >= 0){

    $voiceSel.value =
      String(
        voices.indexOf(
          list[preferred]
        )
      );
  }
}


loadVoices();

speechSynthesis.onvoiceschanged =
  loadVoices;

setTimeout(
  loadVoices,
  400
);

setTimeout(
  loadVoices,
  1200
);
