<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">

  <link rel="manifest" href="manifest.json">

  <title>A.U.R.A</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0c0f;
      color: #e7e9ed;
      font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }

    main {
      width: min(92vw, 520px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .12em;
    }

    #state {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #858b96;
      font-size: 13px;
    }

    #indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555b66;
    }

    #indicator.active {
      background: #8aa2ff;
    }

    #conversation {
      min-height: 170px;
      border-top: 1px solid #1d2026;
      border-bottom: 1px solid #1d2026;
      padding: 20px 0;
    }

    #heard {
      color: #858b96;
      min-height: 22px;
      margin-bottom: 14px;
    }

    #reply {
      color: #e7e9ed;
      line-height: 1.55;
      min-height: 50px;
      white-space: pre-wrap;
    }

    footer {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    button {
      appearance: none;
      border: 1px solid #30343c;
      background: #121419;
      color: #e7e9ed;
      border-radius: 6px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #181b21;
    }

    button:active {
      background: #1d2027;
    }

    button.active {
      border-color: #536cae;
      background: #151b2b;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    #log {
      margin-top: 24px;
      max-height: 130px;
      overflow-y: auto;
      color: #686f7b;
      font-size: 12px;
    }

    #log p {
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <main>

    <header>
      <h1>AURA</h1>

      <div id="state">
        <span id="indicator"></span>
        <span id="status">Ready</span>
      </div>
    </header>

    <section id="conversation">
      <div id="heard">
        Say “AURA” to get my attention.
      </div>

      <div id="reply"></div>
    </section>

    <footer>
      <button id="listen">
        CONSTANT LISTENING: OFF
      </button>
    </footer>

    <div id="log"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    const SUPABASE_URL =
      "https://tvxugmumfvgnvjacwwfz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_1mPqnw9hx5Vm0O_o4O_fsg_96YAhDuY";

    const AURA_FUNCTION =
      SUPABASE_URL + "/functions/v1/aura";

    /*
     * The Supabase CDN exposes window.supabase.
     * Do not name our client "supabase", because that
     * would redeclare the global.
     */
    const auraClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const statusElement =
      document.getElementById("status");

    const indicatorElement =
      document.getElementById("indicator");

    const heardElement =
      document.getElementById("heard");

    const replyElement =
      document.getElementById("reply");

    const logElement =
      document.getElementById("log");

    const listenButton =
      document.getElementById("listen");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let constantListening = false;
    let busy = false;
    let speaking = false;

    function setStatus(text, active = false) {
      statusElement.textContent = text;
      indicatorElement.classList.toggle(
        "active",
        active
      );
    }

    function addLog(source, text) {
      const entry =
        document.createElement("p");

      entry.textContent =
        source + ": " + text;

      logElement.prepend(entry);
    }

    function speak(text) {
      return new Promise(resolve => {

        speechSynthesis.cancel();

        speaking = true;

        const utterance =
          new SpeechSynthesisUtterance(text);

        utterance.rate = 1;
        utterance.pitch = 1;

        utterance.onend = () => {
          speaking = false;
          resolve();
        };

        utterance.onerror = () => {
          speaking = false;
          resolve();
        };

        speechSynthesis.speak(
          utterance
        );
      });
    }

    async function authenticate() {

      const {
        data: { session }
      } = await auraClient.auth.getSession();

      if (session) {
        return session;
      }

      const {
        data,
        error
      } =
        await auraClient.auth.signInAnonymously();

      if (error) {
        setStatus(
          "Authentication failed"
        );

        addLog(
          "ERROR",
          error.message
        );

        return null;
      }

      return data.session;
    }

    async function askAura(message) {

      if (busy || !message) {
        return;
      }

      busy = true;

      if (recognition) {
        try {
          recognition.stop();
        } catch (_) {}
      }

      setStatus("Thinking");
      indicatorElement.classList.add(
        "active"
      );

      heardElement.textContent =
        "You: " + message;

      replyElement.textContent = "";

      addLog(
        "YOU",
        message
      );

      try {

        const {
          data: { session }
        } =
          await auraClient.auth.getSession();

        if (!session) {
          throw new Error(
            "No authenticated Supabase session."
          );
        }

        const response =
          await fetch(
            AURA_FUNCTION,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " +
                  session.access_token
              },

              body: JSON.stringify({
                message: message
              })
            }
          );

        let data;

        try {
          data =
            await response.json();
        } catch (_) {
          throw new Error(
            "AURA returned an invalid response."
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            "AURA request failed."
          );
        }

        const reply =
          String(
            data.text ||
            "I didn't get a response."
          );

        replyElement.textContent =
          reply;

        addLog(
          "AURA",
          reply
        );

        setStatus(
          constantListening
            ? "Listening"
            : "Ready",
          constantListening
        );

        await speak(reply);

      } catch (error) {

        setStatus("Error");

        replyElement.textContent =
          error.message;

        addLog(
          "ERROR",
          error.message
        );

      } finally {

        busy = false;

        if (
          constantListening &&
          !speaking
        ) {
          setTimeout(
            startRecognition,
            200
          );
        }
      }
    }

    function processSpeech(text) {

      if (
        !text ||
        speaking ||
        busy
      ) {
        return;
      }

      heardElement.textContent =
        text;

      /*
       * Accepted wake phrases:
       *
       * AURA
       * Hey AURA
       * Yo AURA
       * Okay AURA
       * Ok AURA
       *
       * Examples:
       *
       * "AURA"
       * "Hey AURA"
       * "Yo AURA, tell me a joke"
       * "Okay AURA check my GitHub"
       */

      const match =
        text.match(
          /^(?:(?:hey|yo|okay|ok)\s+)?aura\b[\s,:-]*(.*)$/i
        );

      if (!match) {
        return;
      }

      const command =
        match[1].trim();

      if (!command) {

        setStatus(
          "Listening",
          true
        );

        speak("Yes?");

        return;
      }

      askAura(command);
    }

    function startRecognition() {

      if (
        !constantListening ||
        !recognition ||
        busy ||
        speaking
      ) {
        return;
      }

      try {
        recognition.start();
      } catch (_) {}
    }

    if (!SpeechRecognition) {

      setStatus(
        "Speech recognition unavailable"
      );

      listenButton.disabled =
        true;

      addLog(
        "ERROR",
        "This browser does not provide SpeechRecognition."
      );

    } else {

      recognition =
        new SpeechRecognition();

      recognition.continuous =
        true;

      recognition.interimResults =
        true;

      recognition.lang =
        "en-US";

      recognition.onstart =
        () => {

          setStatus(
            "Listening",
            true
          );
        };

      recognition.onresult =
        event => {

          let text = "";

          for (
            let i =
              event.resultIndex;

            i <
              event.results.length;

            i++
          ) {

            text +=
              event.results[i][0]
                .transcript;
          }

          processSpeech(
            text.trim()
          );
        };

      recognition.onerror =
        event => {

          if (
            event.error ===
              "not-allowed" ||
            event.error ===
              "service-not-allowed"
          ) {

            constantListening =
              false;

            listenButton.textContent =
              "CONSTANT LISTENING: OFF";

            listenButton.classList.remove(
              "active"
            );

            setStatus(
              "Microphone permission required"
            );

            return;
          }

          if (
            event.error ===
            "audio-capture"
          ) {

            setStatus(
              "Microphone unavailable"
            );

            return;
          }

          if (
            constantListening
          ) {

            setTimeout(
              startRecognition,
              500
            );
          }
        };

      recognition.onend =
        () => {

          if (
            constantListening &&
            !busy &&
            !speaking
          ) {

            setTimeout(
              startRecognition,
              200
            );
          }
        };
    }

    listenButton.onclick =
      async () => {

        if (
          !constantListening
        ) {

          const session =
            await authenticate();

          if (!session) {
            return;
          }

          constantListening =
            true;

          listenButton.textContent =
            "CONSTANT LISTENING: ON";

          listenButton.classList.add(
            "active"
          );

          setStatus(
            "Listening",
            true
          );

          startRecognition();

        } else {

          constantListening =
            false;

          try {
            recognition.stop();
          } catch (_) {}

          speechSynthesis.cancel();

          speaking = false;

          listenButton.textContent =
            "CONSTANT LISTENING: OFF";

          listenButton.classList.remove(
            "active"
          );

          setStatus(
            "Ready"
          );
        }
      };

    authenticate();
  </script>

</body>
</html>
