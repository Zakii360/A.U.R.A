<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06080c">
<title>A.U.R.A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #06080c;
  --s0: #0b0e14;
  --s1: #0f1115;
  --s2: #141720;
  --border: #1c2030;
  --border-hi: #2a3045;
  --text: #c4c9d4;
  --muted: #3e4554;
  --dim: #252a38;
  --accent: #c8922a;
  --accent-lo: rgba(200,146,42,.07);
  --red: #d95858;
  --green: #4aae7f;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: system-ui, -apple-system, sans-serif;
  --r: 4px;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.6 var(--sans);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  flex: 1;
  min-height: 100vh;
}

.sidebar {
  background: var(--s0);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 28px 0 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-top {
  padding: 0 20px 24px;
  border-bottom: 1px solid var(--border);
}

.wordmark {
  font: 500 11px/1 var(--mono);
  letter-spacing: .18em;
  color: var(--text);
  margin-bottom: 4px;
}

.wordmark-full {
  font: 300 9px/1 var(--mono);
  letter-spacing: .10em;
  color: var(--muted);
}

.sidebar-section {
  padding: 16px 20px 0;
}

.section-label {
  font: 400 9px/1 var(--mono);
  letter-spacing: .14em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.connection-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.conn-input {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font: 11px/1 var(--mono);
  padding: 7px 9px;
  width: 100%;
  outline: none;
  transition: border-color .15s;
}
.conn-input::placeholder { color: var(--muted); }
.conn-input:focus { border-color: var(--accent); }

.conn-btn {
  background: var(--accent-lo);
  border: 1px solid var(--accent);
  border-radius: var(--r);
  color: var(--accent);
  font: 500 10px/1 var(--mono);
  letter-spacing: .08em;
  padding: 7px 10px;
  cursor: pointer;
  width: 100%;
  text-align: center;
  transition: background .15s;
}
.conn-btn:hover { background: rgba(200,146,42,.14); }
.conn-btn:disabled { opacity: .4; cursor: default; }

.conn-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font: 10px/1 var(--mono);
  color: var(--muted);
  padding-top: 2px;
}

.pip {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--dim);
  flex-shrink: 0;
  transition: background .25s;
}
.pip.live { background: var(--green); }
.pip.error { background: var(--red); }
.pip.thinking {
  background: var(--accent);
  animation: blink .9s ease-in-out infinite;
}

@keyframes blink { 0%,100% { opacity:.3; } 50% { opacity:1; } }

.sidebar-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}

.voice-section {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.voice-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.voice-label {
  font: 10px/1 var(--mono);
  color: var(--muted);
}

.voice-select {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font: 11px/1 var(--mono);
  padding: 6px 8px;
  width: 100%;
  cursor: pointer;
  outline: none;
  transition: border-color .15s;
}
.voice-select:focus { border-color: var(--accent); }
.voice-select option { background: #0f1115; }

.slider-row {
  display: grid;
  grid-template-columns: 1fr 32px;
  align-items: center;
  gap: 8px;
}

.slider-row input[type=range] {
  width: 100%;
  height: 2px;
  accent-color: var(--accent);
  cursor: pointer;
  background: var(--border);
  border-radius: 2px;
}
.slider-row input:disabled { opacity: .25; cursor: default; }

.slider-val {
  font: 10px/1 var(--mono);
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.auto-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  gap: 8px;
}

.auto-toggle-label {
  font: 10px/1 var(--mono);
  color: var(--muted);
}

.toggle {
  width: 28px;
  height: 15px;
  background: var(--dim);
  border-radius: 8px;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
  cursor: pointer;
  border: none;
  outline: none;
}
.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform .2s, background .2s;
}
.toggle.on { background: var(--accent-lo); border: 1px solid var(--accent); }
.toggle.on::after { transform: translateX(13px); background: var(--accent); }

.sidebar-bottom {
  margin-top: auto;
  padding: 16px 20px 0;
  border-top: 1px solid var(--border);
}

.log-label {
  font: 9px/1 var(--mono);
  letter-spacing: .12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.log {
  max-height: 90px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.log-entry {
  display: flex;
  gap: 6px;
  font: 10px/1.4 var(--mono);
  color: var(--muted);
}

.log-tag { flex-shrink: 0; }
.log-tag.you  { color: var(--border-hi); }
.log-tag.aura { color: var(--accent); opacity: .6; }
.log-tag.err  { color: var(--red); opacity: .7; }
.log-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main {
  display: flex;
  flex-direction: column;
  padding: 40px 48px 40px;
  max-width: 720px;
}

.main-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 32px;
  gap: 16px;
}

.state-display {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.state-label {
  font: 9px/1 var(--mono);
  letter-spacing: .16em;
  color: var(--muted);
  text-transform: uppercase;
}

.state-value {
  font: 400 13px/1 var(--mono);
  color: var(--text);
}

.listen-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--border-hi);
  border-radius: var(--r);
  color: var(--muted);
  font: 500 10px/1 var(--mono);
  letter-spacing: .10em;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.listen-btn:hover { color: var(--text); border-color: var(--text); }
.listen-btn.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-lo);
}

.mic-icon { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }

.heard {
  font: 11px/1.5 var(--mono);
  color: var(--muted);
  min-height: 17px;
  margin-bottom: 24px;
}

.heard .you-label { color: var(--dim); }

.reply-area {
  flex: 1;
  min-height: 120px;
}

.reply {
  font: 14px/1.75 var(--sans);
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.reply pre {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--s0);
  border: 1px solid var(--border);
  border-radius: var(--r);
  font: 11.5px/1.6 var(--mono);
  overflow-x: auto;
  color: #8d9bb5;
}

.thinking-dots {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 8px 0;
}
.thinking-dots span {
  width: 4px;
  height: 4px;
  background: var(--accent);
  border-radius: 50%;
  animation: blink 1.1s ease-in-out infinite;
  opacity: .3;
}
.thinking-dots span:nth-child(2) { animation-delay: .18s; }
.thinking-dots span:nth-child(3) { animation-delay: .36s; }

.empty-hint {
  font: 12px/1.6 var(--sans);
  color: var(--muted);
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

@media (max-width: 640px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .main { padding: 24px 20px; }
}
</style>
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="wordmark">A.U.R.A</div>
      <div class="wordmark-full">Autonomous User Reasoning Assistant</div>
    </div>

    <div class="sidebar-section" style="margin-top:20px;">
      <div class="section-label">Project</div>
      <div class="connection-block">
        <input class="conn-input" id="sbUrl" type="text" placeholder="https://xyz.supabase.co" autocomplete="off" spellcheck="false">
        <input class="conn-input" id="sbKey" type="text" placeholder="anon / service key" autocomplete="off" spellcheck="false">
        <button class="conn-btn" id="connectBtn">Connect</button>
        <div class="conn-status">
          <span class="pip" id="connPip"></span>
          <span id="connLabel">Not connected</span>
        </div>
      </div>
    </div>

    <hr class="sidebar-divider">

    <div class="voice-section">
      <div class="section-label">Voice</div>

      <div class="voice-row">
        <div class="voice-label">Engine</div>
        <select class="voice-select" id="voiceSelect" aria-label="Voice engine"></select>
      </div>

      <div class="voice-row">
        <div class="voice-label" style="margin-bottom:3px;">Auto adjust</div>
        <div class="auto-toggle" id="autoToggle">
          <span class="auto-toggle-label">AURA tunes delivery per response</span>
          <button class="toggle on" id="autoBtn" aria-pressed="true" aria-label="Auto voice"></button>
        </div>
      </div>

      <div class="voice-row">
        <div class="voice-label">Rate</div>
        <div class="slider-row">
          <input id="rateSlider" type="range" min=".75" max="1.15" step=".01" value=".94" disabled>
          <span class="slider-val" id="rateVal">.94</span>
        </div>
      </div>

      <div class="voice-row">
        <div class="voice-label">Pitch</div>
        <div class="slider-row">
          <input id="pitchSlider" type="range" min=".60" max="1.40" step=".01" value=".98" disabled>
          <span class="slider-val" id="pitchVal">.98</span>
        </div>
      </div>

      <div class="voice-row">
        <div class="voice-label">Volume</div>
        <div class="slider-row">
          <input id="volSlider" type="range" min=".70" max="1" step=".01" value="1" disabled>
          <span class="slider-val" id="volVal">1.00</span>
        </div>
      </div>
    </div>

    <div class="sidebar-bottom">
      <div class="log-label">Session log</div>
      <div class="log" id="log"></div>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div class="state-display">
        <div class="state-label">Status</div>
        <div class="state-value" id="statusText">Ready</div>
      </div>

      <button class="listen-btn" id="listenBtn">
        <svg class="mic-icon" viewBox="0 0 24 24">
          <rect x="9" y="2" width="6" height="13" rx="3"/>
          <path d="M5 10a7 7 0 0014 0"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        Microphone off
      </button>
    </div>

    <div class="heard" id="heard">
      <span class="you-label">—</span> Say "AURA" to wake me.
    </div>

    <div class="reply-area">
      <div class="reply" id="reply">
        <span class="empty-hint">Connect a Supabase project and turn on the microphone. Ask me anything about your data.</span>
      </div>
    </div>
  </main>

</div>

<script>
let supabaseUrl = localStorage.getItem("aura_sb_url") || "";
let supabaseKey = localStorage.getItem("aura_sb_key") || "";
let connected   = false;
let auraUrl     = "";

let recognition = null;
let listening   = false;
let waiting     = true;
let busy        = false;
let speaking    = false;
let wakeTimer   = null;
let voices      = [];

const conversation = [];

const prefs = {
  auto: true,
  rate: .94,
  pitch: .98,
  volume: 1,
};

const $sbUrl     = document.getElementById("sbUrl");
const $sbKey     = document.getElementById("sbKey");
const $connBtn   = document.getElementById("connectBtn");
const $connPip   = document.getElementById("connPip");
const $connLabel = document.getElementById("connLabel");
const $statusTxt = document.getElementById("statusText");
const $heard     = document.getElementById("heard");
const $reply     = document.getElementById("reply");
const $log       = document.getElementById("log");
const $listenBtn = document.getElementById("listenBtn");
const $autoBtn   = document.getElementById("autoBtn");
const $voiceSel  = document.getElementById("voiceSelect");
const $rSlider   = document.getElementById("rateSlider");
const $pSlider   = document.getElementById("pitchSlider");
const $vSlider   = document.getElementById("volSlider");
const $rVal      = document.getElementById("rateVal");
const $pVal      = document.getElementById("pitchVal");
const $vVal      = document.getElementById("volVal");

$sbUrl.value = supabaseUrl;
$sbKey.value = supabaseKey || "";

function setConnected(ok, label) {
  connected = ok;
  $connPip.className = "pip" + (ok ? " live" : "");
  $connLabel.textContent = label;
}

function setStatus(txt, mode) {
  $statusTxt.textContent = txt;
  $connPip.className = "pip" + (
    mode === "live" ? " live" :
    mode === "error" ? " error" :
    mode === "thinking" ? " thinking" : ""
  );
  if (connected && mode !== "thinking" && mode !== "error") {
    $connPip.className = "pip live";
  }
}

async function tryConnect(url, key) {
  if (!url || !key) return false;
  try {
    const r = await fetch(url + "/functions/v1/aura-v3", {
      method: "OPTIONS",
      headers: { apikey: key },
    });
    return r.ok || r.status === 204 || r.status === 200;
  } catch {
    return false;
  }
}

$connBtn.onclick = async () => {
  const url = $sbUrl.value.trim().replace(/\/$/, "");
  const key = $sbKey.value.trim();

  if (!url || !key) {
    setConnected(false, "URL and key required");
    return;
  }

  $connBtn.disabled = true;
  $connBtn.textContent = "Connecting…";
  setConnected(false, "Checking…");

  supabaseUrl = url;
  supabaseKey = key;
  auraUrl = url + "/functions/v1/aura-v3";

  localStorage.setItem("aura_sb_url", url);
  localStorage.setItem("aura_sb_key", key);

  const ok = await tryConnect(url, key);
  $connBtn.disabled = false;
  $connBtn.textContent = "Connect";

  if (ok) {
    setConnected(true, url.replace("https://", "").split(".")[0]);
    addLog("conn", "Connected to " + url.replace("https://","").split(".")[0], "aura");
  } else {
    setConnected(false, "Could not reach edge function");
    auraUrl = url + "/functions/v1/aura-v3";
    setConnected(true, url.replace("https://", "").split(".")[0] + " (assumed)");
    addLog("conn", "Connected (unverified)", "aura");
  }
};

if (DEFAULT_URL && DEFAULT_KEY) {
  auraUrl = DEFAULT_URL + "/functions/v1/aura-v3";
  setConnected(true, DEFAULT_URL.replace("https://","").split(".")[0]);
}

function addLog(type, text, cls) {
  const entry = document.createElement("div");
  entry.className = "log-entry";
  const tag = document.createElement("span");
  tag.className = "log-tag " + (cls || "");
  tag.textContent = type === "conn" ? "SB" : type === "you" ? "YOU" : "AURA";
  const msg = document.createElement("span");
  msg.className = "log-msg";
  msg.textContent = text.slice(0, 120);
  entry.appendChild(tag);
  entry.appendChild(msg);
  $log.insertBefore(entry, $log.firstChild);
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function render(text) {
  $reply.textContent = "";
  const parts = String(text).split(/(```[\s\S]*?```)/g);
  for (const part of parts) {
    if (part.startsWith("```") && part.endsWith("```")) {
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = part.replace(/^```[^\n]*\n?/, "").replace(/```$/, "");
      pre.appendChild(code);
      $reply.appendChild(pre);
    } else if (part.trim()) {
      const span = document.createElement("span");
      span.textContent = part;
      $reply.appendChild(span);
    }
  }
}

function showThinking() {
  $reply.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div>';
}

function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v && v.name);
  $voiceSel.innerHTML = "";
  if (!voices.length) {
    $voiceSel.innerHTML = '<option value="">No voices available</option>';
    return;
  }
  const en = voices.filter(v => /^en/i.test(v.lang));
  const list = en.length ? en : voices;
  list.forEach(v => {
    const opt = document.createElement("option");
    opt.value = String(voices.indexOf(v));
    opt.textContent = v.name;
    $voiceSel.appendChild(opt);
  });
  const prefer = list.findIndex(v => /zira|google us english/i.test(v.name));
  if (prefer >= 0) $voiceSel.value = String(voices.indexOf(list[prefer]));
}

loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 400);
setTimeout(loadVoices, 1200);

function toSpeech(text) {
  return String(text)
    .replace(/```[\s\S]*?```/g, "I've displayed the code.")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/[*_~`#>]/g, "")
    .replace(/\b(API|JSON|HTML|CSS|PWA|URL|UI|UX|OS|AI|CPU|GPU|RAM|SQL|RLS|JWT|UUID)\b/gi, m => m.split("").join(" "))
    .replace(/—/g, ", ")
    .replace(/\s+/g, " ")
    .trim();
}

function speak(text, autoPitch) {
  return new Promise(resolve => {
    const clean = toSpeech(text);
    if (!clean) { resolve(); return; }
    speechSynthesis.cancel();

    const utt = new SpeechSynthesisUtterance(clean);
    const avail = speechSynthesis.getVoices();
    const idx = Number($voiceSel.value);
    if (Number.isInteger(idx) && avail[idx]) utt.voice = avail[idx];

    let rate = prefs.rate, pitch = prefs.pitch, volume = prefs.volume;
    if (prefs.auto && autoPitch) {
      if (isFinite(+autoPitch.rate))   rate   = clamp(+autoPitch.rate, .75, 1.15);
      if (isFinite(+autoPitch.pitch))  pitch  = clamp(+autoPitch.pitch, .6, 1.4);
      if (isFinite(+autoPitch.volume)) volume = clamp(+autoPitch.volume, .7, 1);
    }
    utt.rate = rate; utt.pitch = pitch; utt.volume = volume;

    speaking = true;
    setStatus("Speaking", "live");
    utt.onend = utt.onerror = () => { speaking = false; resolve(); };
    speechSynthesis.speak(utt);
  });
}

function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }

async function ask(text) {
  if (busy || speaking || !text.trim()) return;
  if (!auraUrl) {
    $reply.textContent = "No project connected. Enter a Supabase URL and key in the sidebar.";
    return;
  }

  busy = true;
  waiting = false;
  clearTimeout(wakeTimer);
  try { recognition?.stop(); } catch(_) {}

  setStatus("Thinking", "thinking");
  $heard.innerHTML = `<span class="you-label">You</span>  ${escHtml(text)}`;
  showThinking();
  addLog("you", text, "you");

  try {
    const res = await fetch(auraUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": supabaseKey,
      },
      body: JSON.stringify({
        message: text,
        history: conversation.slice(-12),
        preferences: prefs,
      }),
    });

    let data;
    try { data = await res.json(); } catch(_) { throw new Error("Bad response from edge function."); }
    if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
    if (!data.text) throw new Error("Empty response.");

    conversation.push(
      { role: "user", content: text },
      { role: "assistant", content: data.text }
    );
    if (conversation.length > 24) conversation.splice(0, conversation.length - 24);

    render(data.text);
    addLog("aura", data.text, "aura");
    await speak(data.spoken || data.text, data.pitch);

  } catch(err) {
    $reply.textContent = err.message;
    addLog("err", err.message, "err");
    setStatus("Error", "error");
  } finally {
    busy = false;
    if (listening && !speaking) {
      waiting = true;
      setStatus("Listening", connected ? "live" : "");
      setTimeout(startListening, 200);
    } else if (!listening) {
      setStatus("Ready", connected ? "live" : "");
    }
  }
}

function processSpeech(text) {
  text = text.trim();
  if (!text || busy || speaking) return;
  if (!waiting) { ask(text); return; }

  const m = text.match(/^(?:(?:hey|okay|ok|yo)\s+)?aura\b[\s,:-]*(.*)?$/i);
  if (!m) return;

  waiting = false;
  const cmd = (m[1] || "").trim();
  if (cmd) { ask(cmd); return; }

  $heard.innerHTML = `<span class="you-label">AURA</span>  Listening…`;
  setStatus("Listening", connected ? "live" : "");
  clearTimeout(wakeTimer);
  wakeTimer = setTimeout(() => {
    if (!busy && !speaking) {
      waiting = true;
      $heard.innerHTML = `<span class="you-label">—</span> Say "AURA" to wake me.`;
    }
  }, 5000);
}

const Recog = window.SpeechRecognition || window.webkitSpeechRecognition;

if (Recog) {
  recognition = new Recog();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  recognition.onresult = e => {
    let fin = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      e.results[i].isFinal
        ? (fin += e.results[i][0].transcript)
        : (interim += e.results[i][0].transcript);
    }
    if (interim && !busy && !speaking) {
      $heard.innerHTML = `<span class="you-label">—</span> ${escHtml(interim)}`;
    }
    if (fin) processSpeech(fin);
  };

  recognition.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false;
      $listenBtn.classList.remove("active");
      $listenBtn.lastChild.textContent = " Microphone off";
      setStatus("Mic permission denied", "error");
      return;
    }
    if (listening) setTimeout(startListening, 500);
  };

  recognition.onend = () => {
    if (listening && !busy && !speaking) setTimeout(startListening, 200);
  };
} else {
  $listenBtn.disabled = true;
  $listenBtn.lastChild.textContent = " Not supported";
}

function startListening() {
  if (!recognition || !listening || busy || speaking) return;
  try { recognition.start(); } catch(e) {
    if (!String(e.message).includes("already started")) {
      setTimeout(() => { if (listening && !busy && !speaking) startListening(); }, 300);
    }
  }
}

$listenBtn.onclick = () => {
  if (!listening) {
    listening = true;
    waiting = true;
    $listenBtn.classList.add("active");
    $listenBtn.innerHTML = `<svg class="mic-icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Microphone on`;
    $heard.innerHTML = `<span class="you-label">—</span> Say "AURA" to wake me.`;
    setStatus("Listening", connected ? "live" : "");
    startListening();
  } else {
    listening = false;
    waiting = true;
    speechSynthesis.cancel();
    clearTimeout(wakeTimer);
    try { recognition?.stop(); } catch(_) {}
    $listenBtn.classList.remove("active");
    $listenBtn.innerHTML = `<svg class="mic-icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Microphone off`;
    setStatus("Ready", connected ? "live" : "");
    $heard.innerHTML = `<span class="you-label">—</span> Say "AURA" to wake me.`;
  }
};

$autoBtn.onclick = () => {
  prefs.auto = !prefs.auto;
  $autoBtn.classList.toggle("on", prefs.auto);
  $autoBtn.setAttribute("aria-pressed", prefs.auto);
  [$rSlider, $pSlider, $vSlider].forEach(s => s.disabled = prefs.auto);
};

document.getElementById("autoToggle").onclick = e => {
  if (e.target !== $autoBtn) $autoBtn.click();
};

function syncSliders() {
  prefs.rate   = clamp(+$rSlider.value, .75, 1.15);
  prefs.pitch  = clamp(+$pSlider.value, .60, 1.40);
  prefs.volume = clamp(+$vSlider.value, .70, 1);
  $rVal.textContent = prefs.rate.toFixed(2);
  $pVal.textContent = prefs.pitch.toFixed(2);
  $vVal.textContent = prefs.volume.toFixed(2);
}
$rSlider.oninput = $pSlider.oninput = $vSlider.oninput = syncSliders;
syncSliders();
</script>
</body>
</html>
