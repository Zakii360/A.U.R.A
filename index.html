<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#0b0c0f;
  color:#e7e9ed;
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

main{width:min(92vw,680px)}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px
}

h1{
  margin:0;
  font-size:18px;
  font-weight:600;
  letter-spacing:.16em
}

#state{
  display:flex;
  align-items:center;
  gap:8px;
  color:#858b96;
  font-size:13px
}

#dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4d525b
}

#conversation{
  padding:20px 0;
  border-top:1px solid #1d2026;

}

}

  min-height:50px;

#reply pre{

button,select{
  padding:10px 14px;

  border-radius:6px;
  background:#121419;
  color:#e7e9ed;

}

button{cursor:pointer}

button:hover,
select:hover{
  background:#181b21
}

button.active{
  border-color:#536cae;
  background:#151b2b
}

select{
  min-width:230px;
  cursor:pointer
}

.customization{
  margin-top:14px;
  padding:14px;
  border:1px solid #1d2026;

.customization label{
  display:grid;

}

.value{
  text-align:right;
  color:#aeb4bf;

}

#log{
  max-height:140px;
  margin-top:20px;
  overflow:auto;
  color:#686f7b;
  font-size:12px
}

#log p{margin:5px 0}

.disabled{
  opacity:.45;

small{

  display:block;
  margin-top:8px

<body>

<main>

<header>
  <h1>AURA</h1>

  <div id="state">
    <span id="dot"></span>
    <span id="status">Ready</span>
  </div>
</header>


<section id="conversation">

  <div id="heard">
    Say “AURA” to get my attention.
  </div>

  <div id="reply"></div>

</section>


<div class="controls">

  <button id="listen">
    CONSTANT LISTENING: OFF
  </button>

  <button
    id="autoVoice"
    class="active"
    type="button"
  >
    AUTO VOICE: ON
  </button>

  <select
    id="voice"
    aria-label="Voice"
  ></select>

</div>


<div class="customization">

  <label>
    <span>Rate</span>

    <input
      id="rate"
      type="range"
      min=".75"
      max="1.15"
      step=".01"
      value=".94"
    >

    <span
      id="rateValue"
      class="value"
    >.94</span>
  </label>


  <label>
    <span>Pitch</span>

    <input
      id="pitch"
      type="range"
      min=".60"
      max="1.40"
      step=".01"
      value=".98"
    >

    <span
      id="pitchValue"
      class="value"
    >.98</span>
  </label>


  <label>
    <span>Volume</span>

    <input
      id="volume"
      type="range"
      min=".70"
      max="1"
      step=".01"
      value="1"
    >

    <span
      id="volumeValue"
      class="value"
    >1.00</span>
  </label>

  <small id="voiceMode">
    Automatic voice direction is enabled.
  </small>

</div>


<div id="log"></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://tvxugmumfvgnvjacwwfz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1mPqnw9hx5Vm0O_o4O_fsg_96YAhDuY";

const AURA_URL =
  SUPABASE_URL + "/functions/v1/aura-v2";


const statusEl =
  document.getElementById("status");

const dot =
  document.getElementById("dot");

const heard =
  document.getElementById("heard");

const reply =
  document.getElementById("reply");

const logEl =
  document.getElementById("log");

const listenBtn =
  document.getElementById("listen");

const autoVoiceBtn =
  document.getElementById("autoVoice");

const voiceSelect =
  document.getElementById("voice");

const rateControl =
  document.getElementById("rate");

const pitchControl =
  document.getElementById("pitch");

const volumeControl =
  document.getElementById("volume");

const rateValue =
  document.getElementById("rateValue");

const pitchValue =
  document.getElementById("pitchValue");

const volumeValue =
  document.getElementById("volumeValue");

const voiceMode =
  document.getElementById("voiceMode");


let recognition = null;

let listening = false;

let waiting = true;

let busy = false;

let speaking = false;

let wakeTimer = null;

let voices = [];


/*
 * This is deliberately kept locally.
 * It gives AURA short-term conversational
 * memory without another database table.
 */
const conversation = [];


const preferences = {
  automaticVoice: true,
  rate: .94,
  pitch: .98,
  volume: 1
};


/* -------------------------
   UI STATE
------------------------- */

function setStatus(
  text,
  active = false
){

  statusEl.textContent =
    text;

  dot.classList.toggle(
    "on",
    active
  );
}


function log(
  source,
  text
){

  const p =
    document.createElement(
      "p"
    );

  p.textContent =
    source +
    ": " +
    text;

  logEl.prepend(p);
}


function clamp(
  value,
  min,
  max
){

  return Math.min(
    max,
    Math.max(
      min,
      value
    )
  );
}


/* -------------------------
   VOICE LOADING
------------------------- */

function getVoices(){

  return speechSynthesis
    .getVoices()
    .filter(
      voice =>
        voice &&
        voice.name
    );
}


function loadVoices(){

  voices =
    getVoices();


  voiceSelect.innerHTML =
    "";


  if(!voices.length){

    const option =
      document.createElement(
        "option"
      );

    option.textContent =
      "Browser voices unavailable";

    option.value = "";

    voiceSelect.appendChild(
      option
    );

    return;
  }


  /*
   * Prefer English voices, but don't
   * hide other voices if the browser
   * provides them.
   */
  const english =
    voices.filter(
      voice =>
        /^en(-|_)/i.test(
          voice.lang
        )
    );


  const list =
    english.length
      ? english
      : voices;


  list.forEach(
    voice => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(
          voices.indexOf(
            voice
          )
        );

      option.textContent =
        voice.name +
        " — " +
        voice.lang;

      voiceSelect.appendChild(
        option
      );
    }
  );


  /*
   * Pick a reasonable voice initially.
   * Microsoft Zira / Google US are usually
   * more natural than the old default voice.
   */
  const preferred =
    list.findIndex(
      voice =>
        /zira|google us english/i
          .test(voice.name)
    );


  if(preferred >= 0){

    const actualIndex =
      voices.indexOf(
        list[preferred]
      );

    voiceSelect.value =
      String(actualIndex);
  }
}


loadVoices();

speechSynthesis.onvoiceschanged =
  loadVoices;


/*
 * Some browsers populate voices slightly
 * after page load.
 */
setTimeout(
  loadVoices,
  300
);

setTimeout(
  loadVoices,
  1000
);


/* -------------------------
   RENDERING
------------------------- */

function render(text){

  reply.textContent =
    "";

  const parts =
    String(text)
      .split(
        /(```[\s\S]*?```)/g
      );


  for(
    const part of parts
  ){

    if(
      part.startsWith("```") &&
      part.endsWith("```")
    ){

      const pre =
        document.createElement(
          "pre"
        );

      const code =
        document.createElement(
          "code"
        );


      code.textContent =
        part
          .replace(
            /^```[^\n]*\n?/,
            ""
          )
          .replace(
            /```$/,
            ""
          );


      pre.appendChild(
        code
      );

      reply.appendChild(
        pre
      );


    }else if(
      part.trim()
    ){

      const span =
        document.createElement(
          "span"
        );

      span.textContent =
        part;

      reply.appendChild(
        span
      );
    }
  }
}


/* -------------------------
   SPEECH NORMALIZATION
------------------------- */

function speechText(
  text
){

  return String(text)

    /*
     * Never read code aloud.
     */
    .replace(
      /```[\s\S]*?```/g,
      "I've outputted the code for you."
    )

    .replace(
      /\[([^\]]+)\]\([^)]*\)/g,
      "$1"
    )

    .replace(
      /[*_~`#>]/g,
      ""
    )

    /*
     * Acronyms.
     */
    .replace(
      /\bOrbitOS\b/gi,
      "Orbit O S"
    )

    .replace(
      /\bOrbit OS\b/gi,
      "Orbit O S"
    )

    .replace(
      /\bAPI\b/gi,
      "A P I"
    )

    .replace(
      /\bJSON\b/gi,
      "J S O N"
    )

    .replace(
      /\bHTML\b/gi,
      "H T M L"
    )

    .replace(
      /\bCSS\b/gi,
      "C S S"
    )

    .replace(
      /\bPWA\b/gi,
      "P W A"
    )

    .replace(
      /\bURL\b/gi,
      "U R L"
    )

    .replace(
      /\bUI\b/gi,
      "U I"
    )

    .replace(
      /\bUX\b/gi,
      "U X"
    )

    .replace(
      /\bOS\b/gi,
      "O S"
    )

    .replace(
      /\bAI\b/gi,
      "A I"
    )

    .replace(
      /\bCPU\b/gi,
      "C P U"
    )

    .replace(
      /\bGPU\b/gi,
      "G P U"
    )

    .replace(
      /\bRAM\b/gi,
      "R A M"
    )

    /*
     * Natural pauses.
     */
    .replace(
      /—/g,
      " … "
    )

    .replace(
      /\.{3}/g,
      " … "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();
}


/* -------------------------
   SPEECH
------------------------- */

function speak(
  text,
  automaticPitch
){

  return new Promise(
    resolve => {

      const clean =
        speechText(text);


      if(!clean){

        resolve();

        return;
      }


      /*
       * Cancel anything still queued.
       */
      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          clean
        );


      /*
       * ALWAYS resolve the currently
       * selected browser voice.
       */
      const available =
        getVoices();

      const selectedIndex =
        Number(
          voiceSelect.value
        );


      if(
        Number.isInteger(
          selectedIndex
        ) &&
        available[selectedIndex]
      ){

        utterance.voice =
          available[selectedIndex];
      }


      /*
       * Start with manual controls.
       */
      let rate =
        preferences.rate;

      let pitch =
        preferences.pitch;

      let volume =
        preferences.volume;


      /*
       * PITCH_KEY may override those
       * values ONLY when Auto Voice is ON.
       */
      if(
        preferences.automaticVoice &&
        automaticPitch
      ){

        if(
          Number.isFinite(
            Number(
              automaticPitch.rate
            )
          )
        ){

          rate =
            clamp(
              Number(
                automaticPitch.rate
              ),
              .75,
              1.15
            );
        }


        if(
          Number.isFinite(
            Number(
              automaticPitch.pitch
            )
          )
        ){

          pitch =
            clamp(
              Number(
                automaticPitch.pitch
              ),
              .60,
              1.40
            );
        }


        if(
          Number.isFinite(
            Number(
              automaticPitch.volume
            )
          )
        ){

          volume =
            clamp(
              Number(
                automaticPitch.volume
              ),
              .70,
              1
            );
        }
      }


      utterance.rate =
        rate;

      utterance.pitch =
        pitch;

      utterance.volume =
        volume;


      speaking =
        true;


      setStatus(
        "Speaking",
        true
      );


      utterance.onend =
        () => {

          speaking =
            false;

          resolve();
        };


      utterance.onerror =
        () => {

          speaking =
            false;

          resolve();
        };


      speechSynthesis.speak(
        utterance
      );
    }
  );
}


/* -------------------------
   CONSTANT LISTENING
------------------------- */

function startListening(){

  if(
    !recognition ||
    !listening ||
    busy ||
    speaking
  ){

    return;
  }


  try{

    recognition.start();

  }catch(error){

    /*
     * Chrome throws if recognition is
     * already running. That's harmless.
     */
    if(
      !String(
        error.message
      )
        .toLowerCase()
        .includes(
          "already started"
        )
    ){

      setTimeout(
        () => {

          if(
            listening &&
            !busy &&
            !speaking
          ){

            startListening();
          }

        },
        300
      );
    }
  }
}


/* -------------------------
   AURA
------------------------- */

async function askAURA(
  text
){

  if(
    busy ||
    speaking ||
    !text.trim()
  ){

    return;
  }


  busy =
    true;

  waiting =
    false;


  clearTimeout(
    wakeTimer
  );


  try{
    recognition?.stop();
  }catch(_){}


  setStatus(
    "Thinking",
    true
  );


  heard.textContent =
    "You: " +
    text;

  reply.textContent =
    "";


  log(
    "YOU",
    text
  );


  try{

    const response =
      await fetch(
        AURA_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({

            message:text,

            history:
              conversation
                .slice(-12),

            preferences

          })
        }
      );


    let data;


    try{

      data =
        await response.json();

    }catch(_){

      throw new Error(
        "AURA returned an invalid response."
      );
    }


    if(
      !response.ok
    ){

      throw new Error(
        data.error ||
        "AURA request failed."
      );
    }


    if(
      !data.text
    ){

      throw new Error(
        "AURA returned no response."
      );
    }


    conversation.push(

      {
        role:"user",
        content:text
      },

      {
        role:"assistant",
        content:data.text
      }

    );


    if(
      conversation.length >
      24
    ){

      conversation.splice(
        0,
        conversation.length - 24
      );
    }


    render(
      data.text
    );


    log(
      "AURA",
      data.text
    );


    /*
     * Voice starts as soon as the AI
     * response has arrived.
     */
    await speak(
      data.spoken ||
      data.text,
      data.pitch
    );


  }catch(error){

    reply.textContent =
      error.message;

    log(
      "ERROR",
      error.message
    );

    setStatus(
      "Error"
    );


  }finally{

    busy =
      false;


    if(
      listening &&
      !speaking
    ){

      waiting =
        true;

      setStatus(
        "Listening",
        true
      );


      setTimeout(
        startListening,
        200
      );


    }else if(
      !listening
    ){

      setStatus(
        "Ready"
      );
    }
  }
}


/* -------------------------
   WAKE WORD
------------------------- */

function processSpeech(
  text
){

  text =
    text.trim();


  if(
    !text ||
    busy ||
    speaking
  ){

    return;
  }


  /*
   * Once AURA has been activated,
   * the next sentence is the command.
   */
  if(!waiting){

    askAURA(
      text
    );

    return;
  }


  const match =
    text.match(
      /^(?:(?:hey|yo|okay|ok)\s+)?aura\b[\s,:-]*(.*)$/i
    );


  if(!match){

    return;
  }


  waiting =
    false;


  const command =
    match[1].trim();


  if(command){

    askAURA(
      command
    );

    return;
  }


  heard.textContent =
    "AURA is listening…";


  setStatus(
    "Listening",
    true
  );


  clearTimeout(
    wakeTimer
  );


  wakeTimer =
    setTimeout(
      () => {

        if(
          !busy &&
          !speaking
        ){

          waiting =
            true;

          heard.textContent =
            "Say “AURA” to get my attention.";
        }

      },
      5000
    );
}


/* -------------------------
   SPEECH RECOGNITION
------------------------- */

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(!Recognition){

  setStatus(
    "Speech recognition unavailable"
  );

  listenBtn.disabled =
    true;

}else{

  recognition =
    new Recognition();


  recognition.continuous =
    true;

  recognition.interimResults =
    true;

  recognition.lang =
    "en-US";


  recognition.onstart =
    () => {

      setStatus(
        "Listening",
        true
      );
    };


  recognition.onresult =
    event => {

      let finalText =
        "";

      let interim =
        "";


      for(
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ){

        const result =
          event.results[i];


        if(
          result.isFinal
        ){

          finalText +=
            result[0].transcript;

        }else{

          interim +=
            result[0].transcript;
        }
      }


      if(
        interim &&
        !busy &&
        !speaking
      ){

        heard.textContent =
          interim;
      }


      if(finalText){

        processSpeech(
          finalText
        );
      }
    };


  recognition.onerror =
    event => {

      if(
        event.error ===
          "not-allowed" ||

        event.error ===
          "service-not-allowed"
      ){

        listening =
          false;


        listenBtn.textContent =
          "CONSTANT LISTENING: OFF";


        listenBtn.classList.remove(
          "active"
        );


        setStatus(
          "Microphone permission required"
        );


        return;
      }


      if(listening){

        setTimeout(
          startListening,
          500
        );
      }
    };


  recognition.onend =
    () => {

      if(
        listening &&
        !busy &&
        !speaking
      ){

        setTimeout(
          startListening,
          200
        );
      }
    };
}


/* -------------------------
   CONSTANT LISTENING BUTTON
------------------------- */

listenBtn.onclick =
  () => {

    if(!listening){

      listening =
        true;

      waiting =
        true;


      listenBtn.textContent =
        "CONSTANT LISTENING: ON";


      listenBtn.classList.add(
        "active"
      );


      heard.textContent =
        "Say “AURA” to get my attention.";


      setStatus(
        "Listening",
        true
      );


      startListening();


    }else{

      listening =
        false;

      waiting =
        true;


      speechSynthesis.cancel();


      clearTimeout(
        wakeTimer
      );


      try{
        recognition?.stop();
      }catch(_){}


      listenBtn.textContent =
        "CONSTANT LISTENING: OFF";


      listenBtn.classList.remove(
        "active"
      );


      setStatus(
        "Ready"
      );


      heard.textContent =
        "Say “AURA” to get my attention.";
    }
  };


/* -------------------------
   AUTO VOICE
------------------------- */

autoVoiceBtn.onclick =
  () => {

    preferences.automaticVoice =
      !preferences.automaticVoice;


    autoVoiceBtn.textContent =
      "AUTO VOICE: " +
      (
        preferences.automaticVoice
          ? "ON"
          : "OFF"
      );


    autoVoiceBtn.classList.toggle(
      "active",
      preferences.automaticVoice
    );


    /*
     * Actually disable/enable the
     * manual controls visually.
     */
    const disabled =
      preferences.automaticVoice;


    rateControl.disabled =
      disabled;

    pitchControl.disabled =
      disabled;

    volumeControl.disabled =
      disabled;


    rateControl.parentElement.classList.toggle(
      "disabled",
      disabled
    );

    pitchControl.parentElement.classList.toggle(
      "disabled",
      disabled
    );

    volumeControl.parentElement.classList.toggle(
      "disabled",
      disabled
    );


    voiceMode.textContent =
      disabled
        ? "Automatic voice direction is enabled."
        : "Manual voice controls are enabled.";


    /*
     * If AURA is currently speaking,
     * stop it so the next response uses
     * the newly selected mode.
     */
    if(speaking){

      speechSynthesis.cancel();

      speaking =
        false;

      setStatus(
        listening
          ? "Listening"
          : "Ready",
        listening
      );
    }
  };


/* -------------------------
   VOICE SELECTOR
------------------------- */

voiceSelect.onchange =
  () => {

    const selected =
      getVoices()[
        Number(
          voiceSelect.value
        )
      ];


    if(selected){

      log(
        "VOICE",
        selected.name +
        " (" +
        selected.lang +
        ")"
      );


      /*
       * Don't interrupt a sentence.
       * The selected voice will be used
       * on the next response.
       */
    }
  };


/* -------------------------
   MANUAL CONTROLS
------------------------- */

function updateRate(){

  preferences.rate =
    clamp(
      Number(
        rateControl.value
      ),
      .75,
      1.15
    );


  rateValue.textContent =
    preferences.rate.toFixed(2);
}


function updatePitch(){

  preferences.pitch =
    clamp(
      Number(
        pitchControl.value
      ),
      .60,
      1.40
    );


  pitchValue.textContent =
    preferences.pitch.toFixed(2);
}


function updateVolume(){

  preferences.volume =
    clamp(
      Number(
        volumeControl.value
      ),
      .70,
      1
    );


  volumeValue.textContent =
    preferences.volume.toFixed(2);
}


rateControl.addEventListener(
  "input",
  updateRate
);

pitchControl.addEventListener(
  "input",
  updatePitch
);

volumeControl.addEventListener(
  "input",
  updateVolume
);


updateRate();
updatePitch();
updateVolume();


/*
 * Auto Voice starts ON, so the sliders
 * are disabled until the user turns it OFF.
 */
rateControl.disabled =
  true;

pitchControl.disabled =
  true;

volumeControl.disabled =
  true;


/* -------------------------
   PWA
------------------------- */

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker
    .register("./sw.js")
    .catch(
      error =>
        log(
          "PWA",
          error.message
        )
    );
}

</script>

</body>
</html>
