<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="manifest" href="manifest.json">
  <title>AURA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0c0f;
      color: #e7e9ed;
      font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }

    main {
      width: min(92vw, 620px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .14em;
    }

    #state {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #858b96;
      font-size: 13px;
    }

    #indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555b66;
    }

    #indicator.active {
      background: #8aa2ff;
    }

    #conversation {
      border-top: 1px solid #1d2026;
      border-bottom: 1px solid #1d2026;
      padding: 20px 0;
    }

    #heard {
      color: #858b96;
      min-height: 22px;
      margin-bottom: 14px;
    }

    #reply {
      color: #e7e9ed;
      line-height: 1.6;
      min-height: 50px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #reply pre {
      margin: 16px 0 0;
      padding: 14px;
      overflow-x: auto;
      background: #111318;
      border: 1px solid #20242c;
      border-radius: 6px;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-align: left;
    }

    #reply code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    footer {
      margin-top: 20px;
    }

    button {
      appearance: none;
      border: 1px solid #30343c;
      background: #121419;
      color: #e7e9ed;
      border-radius: 6px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #181b21;
    }

    button.active {
      border-color: #536cae;
      background: #151b2b;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    #log {
      margin-top: 24px;
      max-height: 130px;
      overflow-y: auto;
      color: #686f7b;
      font-size: 12px;
    }

    #log p {
      margin: 5px 0;
    }
  </style>
</head>

<body>

<main>

  <header>
    <h1>AURA</h1>

    <div id="state">
      <span id="indicator"></span>
      <span id="status">Ready</span>
    </div>
  </header>

  <section id="conversation">

    <div id="heard">
      Say “AURA” to get my attention.
    </div>

    <div id="reply"></div>

  </section>

  <footer>
    <button id="listen">
      CONSTANT LISTENING: OFF
    </button>
  </footer>

  <div id="log"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }

  const SUPABASE_URL =
    "https://tvxugmumfvgnvjacwwfz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_1mPqnw9hx5Vm0O_o4O_fsg_96YAhDuY";

  const AURA_FUNCTION =
    SUPABASE_URL + "/functions/v1/aura-v2";

  const TTS_FUNCTION =
    SUPABASE_URL + "/functions/v1/tts";

  /*
   * Rachel is an ElevenLabs premade voice.
   * The actual ElevenLabs API key stays inside Supabase.
   */
  const TTS_VOICE =
    "21m00Tcm4TlvDq8ikWAM";

  const auraClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const statusElement =
    document.getElementById("status");

  const indicatorElement =
    document.getElementById("indicator");

  const heardElement =
    document.getElementById("heard");

  const replyElement =
    document.getElementById("reply");

  const logElement =
    document.getElementById("log");

  const listenButton =
    document.getElementById("listen");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  let recognition = null;
  let constantListening = false;
  let busy = false;
  let speaking = false;

  let waitingForCommand = false;
  let wakeTimer = null;

  function setStatus(text, active = false) {
    statusElement.textContent = text;

    indicatorElement.classList.toggle(
      "active",
      active
    );
  }

  function addLog(source, text) {
    const entry =
      document.createElement("p");

    entry.textContent =
      source + ": " + text;

    logElement.prepend(entry);
  }

  function renderResponse(text) {
    replyElement.textContent = "";

    /*
     * Keep normal text as text, but render fenced
     * code visually so AURA doesn't have to speak it.
     */

    const parts =
      text.split(/(```[\s\S]*?```)/g);

    for (const part of parts) {

      if (
        part.startsWith("```") &&
        part.endsWith("```")
      ) {

        const code =
          part
            .replace(/^```[^\n]*\n?/, "")
            .replace(/```$/, "");

        const pre =
          document.createElement("pre");

        const codeElement =
          document.createElement("code");

        codeElement.textContent =
          code;

        pre.appendChild(
          codeElement
        );

        replyElement.appendChild(
          pre
        );

      } else if (part.trim()) {

        const textNode =
          document.createElement("span");

        textNode.textContent =
          part;

        replyElement.appendChild(
          textNode
        );
      }
    }
  }

  async function browserSpeak(text) {

    if (
      !("speechSynthesis" in window)
    ) {
      return;
    }

    return new Promise(resolve => {

      speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          text
        );

      const voices =
        speechSynthesis.getVoices();

      const preferred =
        voices.find(v =>
          /en-GB/i.test(v.lang) &&
          /natural|neural|premium|google|microsoft/i.test(v.name)
        ) ||
        voices.find(v =>
          /en-US/i.test(v.lang) &&
          /natural|neural|premium|google|microsoft/i.test(v.name)
        ) ||
        voices.find(v =>
          /^en/i.test(v.lang)
        );

      if (preferred) {
        utterance.voice =
          preferred;
      }

      utterance.rate = 0.96;
      utterance.pitch = 0.96;
      utterance.volume = 1;

      utterance.onend = () => {
        speaking = false;
        resolve();
      };

      utterance.onerror = () => {
        speaking = false;
        resolve();
      };

      speaking = true;

      speechSynthesis.speak(
        utterance
      );
    });
  }

  async function speak(text) {

    if (!text) return;

    speaking = true;

    try {

      const {
        data: { session }
      } =
        await auraClient.auth.getSession();

      if (session) {

        const response =
          await fetch(
            TTS_FUNCTION,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " +
                  session.access_token
              },

              body: JSON.stringify({
                text: text,
                voiceId: TTS_VOICE
              })
            }
          );

        if (response.ok) {

          const audioBlob =
            await response.blob();

          const audioUrl =
            URL.createObjectURL(
              audioBlob
            );

          const audio =
            new Audio(audioUrl);

          await new Promise(resolve => {

            audio.onended = () => {
              URL.revokeObjectURL(
                audioUrl
              );

              speaking = false;
              resolve();
            };

            audio.onerror = () => {
              URL.revokeObjectURL(
                audioUrl
              );

              resolve();
            };

            audio.play().catch(() =>
              resolve()
            );
          });

          return;
        }
      }

    } catch (_) {
      /*
       * If neural TTS isn't available,
       * fall back to the browser voice.
       */
    }

    await browserSpeak(text);
  }

  async function authenticate() {

    const {
      data: { session }
    } =
      await auraClient.auth.getSession();

    if (session) {
      return session;
    }

    const {
      data,
      error
    } =
      await auraClient.auth.signInAnonymously();

    if (error) {

      setStatus(
        "Authentication failed"
      );

      addLog(
        "ERROR",
        error.message
      );

      return null;
    }

    return data.session;
  }

  async function askAura(message) {

    if (
      busy ||
      !message
    ) {
      return;
    }

    busy = true;

    waitingForCommand = false;

    clearTimeout(
      wakeTimer
    );

    try {
      recognition.stop();
    } catch (_) {}

    setStatus(
      "Thinking"
    );

    heardElement.textContent =
      "You: " + message;

    replyElement.textContent =
      "";

    addLog(
      "YOU",
      message
    );

    try {

      const {
        data: { session }
      } =
        await auraClient.auth.getSession();

      if (!session) {
        throw new Error(
          "No authenticated Supabase session."
        );
      }

      const response =
        await fetch(
          AURA_FUNCTION,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " +
                session.access_token
            },

            body: JSON.stringify({
              message
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "AURA request failed."
        );
      }

      renderResponse(
        data.text
      );

      addLog(
        "AURA",
        data.text
      );

      setStatus(
        "Speaking",
        true
      );

      /*
       * IMPORTANT:
       * data.spoken is what AURA actually says.
       * data.text can contain code.
       */

      await speak(
        data.spoken ||
        data.text
      );

    } catch (error) {

      setStatus(
        "Error"
      );

      replyElement.textContent =
        error.message;

      addLog(
        "ERROR",
        error.message
      );

      await speak(
        "I ran into a problem."
      );

    } finally {

      busy = false;

      if (
        constantListening
      ) {

        setStatus(
          "Listening",
          true
        );

        setTimeout(
          startRecognition,
          250
        );
      }
    }
  }

  function wakeDetected(command) {

    waitingForCommand =
      true;

    setStatus(
      "Listening",
      true
    );

    heardElement.textContent =
      "AURA is listening…";

    /*
     * Don't immediately say "Yes?".
     *
     * This is what caused the annoying
     * repeated YES responses.
     */

    if (command) {

      askAura(command);
      return;
    }

    clearTimeout(
      wakeTimer
    );

    wakeTimer =
      setTimeout(() => {

        if (
          waitingForCommand &&
          !busy
        ) {

          waitingForCommand =
            false;

          setStatus(
            "Listening",
            true
          );

          /*
           * No unnecessary "Yes?".
           * AURA simply waits.
           */

          startRecognition();
        }

      }, 2500);
  }

  function processSpeech(text, isFinal) {

    if (
      !text ||
      speaking ||
      busy ||
      !isFinal
    ) {
      return;
    }

    const normalized =
      text.trim();

    /*
     * If AURA has already been woken
     * and the next recognition result
     * contains the command, use it.
     */

    if (
      waitingForCommand &&
      !/^(?:hey|yo|okay|ok)?\s*aura\b/i.test(
        normalized
      )
    ) {

      wakeDetected(
        normalized
      );

      return;
    }

    const match =
      normalized.match(
        /^(?:(?:hey|yo|okay|ok)\s+)?aura\b[\s,:-]*(.*)$/i
      );

    if (!match) {
      return;
    }

    const command =
      match[1].trim();

    wakeDetected(
      command
    );
  }

  function startRecognition() {

    if (
      !constantListening ||
      !recognition ||
      busy ||
      speaking
    ) {
      return;
    }

    try {
      recognition.start();
    } catch (_) {}
  }

  if (!SpeechRecognition) {

    setStatus(
      "Speech recognition unavailable"
    );

    listenButton.disabled =
      true;

    addLog(
      "ERROR",
      "Speech recognition is unavailable in this browser."
    );

  } else {

    recognition =
      new SpeechRecognition();

    recognition.continuous =
      true;

    recognition.interimResults =
      true;

    recognition.lang =
      "en-US";

    recognition.onstart =
      () => {

        setStatus(
          "Listening",
          true
        );
      };

    recognition.onresult =
      event => {

        let finalText = "";
        let interimText = "";

        for (
          let i =
            event.resultIndex;

          i <
            event.results.length;

          i++
        ) {

          const result =
            event.results[i];

          if (
            result.isFinal
          ) {

            finalText +=
              result[0].transcript;

          } else {

            interimText +=
              result[0].transcript;
          }
        }

        if (
          interimText &&
          !busy &&
          !speaking
        ) {

          heardElement.textContent =
            interimText;
        }

        if (finalText) {

          processSpeech(
            finalText,
            true
          );
        }
      };

    recognition.onerror =
      event => {

        if (
          event.error ===
            "not-allowed" ||
          event.error ===
            "service-not-allowed"
        ) {

          constantListening =
            false;

          listenButton.textContent =
            "CONSTANT LISTENING: OFF";

          listenButton.classList.remove(
            "active"
          );

          setStatus(
            "Microphone permission required"
          );

          return;
        }

        if (
          event.error ===
          "audio-capture"
        ) {

          setStatus(
            "Microphone unavailable"
          );

          return;
        }

        if (
          constantListening &&
          !busy &&
          !speaking
        ) {

          setTimeout(
            startRecognition,
            500
          );
        }
      };

    recognition.onend =
      () => {

        if (
          constantListening &&
          !busy &&
          !speaking
        ) {

          setTimeout(
            startRecognition,
            200
          );
        }
      };
  }

  listenButton.onclick =
    async () => {

      if (
        !constantListening
      ) {

        const session =
          await authenticate();

        if (!session) {
          return;
        }

        constantListening =
          true;

        listenButton.textContent =
          "CONSTANT LISTENING: ON";

        listenButton.classList.add(
          "active"
        );

        setStatus(
          "Listening",
          true
        );

        startRecognition();

      } else {

        constantListening =
          false;

        waitingForCommand =
          false;

        clearTimeout(
          wakeTimer
        );

        try {
          recognition.stop();
        } catch (_) {}

        speechSynthesis.cancel();

        speaking =
          false;

        listenButton.textContent =
          "CONSTANT LISTENING: OFF";

        listenButton.classList.remove(
          "active"
        );

        setStatus(
          "Ready"
        );
      }
    };

  authenticate();
</script>

</body>
</html>
