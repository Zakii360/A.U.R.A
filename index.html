<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.json">
<title>A.U.R.A</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0b0c0f;
  color:#e7e9ed;
  font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:grid;
  place-items:center
}

main{
  width:min(92vw,620px)
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px
}

h1{
  margin:0;
  font-size:18px;
  font-weight:600;
  letter-spacing:.14em
}

#state{
  display:flex;
  align-items:center;
  gap:8px;
  color:#858b96;
  font-size:13px
}

#indicator{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#555b66
}

#indicator.active{
  background:#8aa2ff
}

#conversation{
  border-top:1px solid #1d2026;
  border-bottom:1px solid #1d2026;
  padding:20px 0
}

#heard{
  color:#858b96;
  min-height:22px;
  margin-bottom:14px
}

#reply{
  min-height:50px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

#reply pre{
  margin:16px 0 0;
  padding:14px;
  overflow:auto;
  background:#111318;
  border:1px solid #20242c;
  border-radius:6px;
  font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace
}

footer{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

button,select{
  appearance:none;
  border:1px solid #30343c;
  background:#121419;
  color:#e7e9ed;
  border-radius:6px;
  padding:10px 14px;
  font:inherit
}

button{
  cursor:pointer
}

button:hover,
select:hover{
  background:#181b21
}

button.active{
  border-color:#536cae;
  background:#151b2b
}

#log{
  margin-top:24px;
  max-height:130px;
  overflow:auto;
  color:#686f7b;
  font-size:12px
}

#log p{
  margin:5px 0
}
</style>
</head>

<body>

<main>

<header>
  <h1>AURA</h1>

  <div id="state">
    <span id="indicator"></span>
    <span id="status">Ready</span>
  </div>
</header>

<section id="conversation">

  <div id="heard">
    Say “AURA” to get my attention.
  </div>

  <div id="reply"></div>

</section>

<footer>

  <button id="listen">
    CONSTANT LISTENING: OFF
  </button>

  <select id="voice">

    <option value="21m00Tcm4TlvDq8ikWAM">
      Rachel
    </option>

    <option value="EXAVITQu4vr4xnSDxMaL">
      Bella
    </option>

    <option value="ErXwobaYiN019PkySvjV">
      Antoni
    </option>

    <option value="TxGEqnHWrfWFTfGW9XjX">
      Josh
    </option>

    <option value="VR6AewLTigWG4xSOukaG">
      Arnold
    </option>

  </select>

</footer>

<div id="log"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

if("serviceWorker" in navigator){
  navigator.serviceWorker
    .register("./sw.js")
    .catch(()=>{});
}

const SUPABASE_URL =
  "https://tvxugmumfvgnvjacwwfz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1mPqnw9hx5Vm0O_o4O_fsg_96YAhDuY";

const AURA_FUNCTION =
  SUPABASE_URL +
  "/functions/v1/aura-v2";

const VOICE_FUNCTION =
  SUPABASE_URL +
  "/functions/v1/aura-voice";

const auraClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const statusElement =
  document.getElementById("status");

const indicatorElement =
  document.getElementById("indicator");

const heardElement =
  document.getElementById("heard");

const replyElement =
  document.getElementById("reply");

const logElement =
  document.getElementById("log");

const listenButton =
  document.getElementById("listen");

const voiceSelect =
  document.getElementById("voice");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition=null;
let constantListening=false;
let busy=false;
let speaking=false;
let waitingForCommand=false;
let wakeTimer=null;


function setStatus(
  text,
  active=false
){

  statusElement.textContent=text;

  indicatorElement
    .classList
    .toggle(
      "active",
      active
    );
}


function addLog(
  source,
  text
){

  const entry =
    document.createElement(
      "p"
    );

  entry.textContent =
    source +
    ": " +
    text;

  logElement.prepend(
    entry
  );
}


function renderResponse(
  text
){

  replyElement.textContent="";

  const parts =
    text.split(
      /(```[\s\S]*?```)/g
    );

  for(
    const part of parts
  ){

    if(
      part.startsWith("```") &&
      part.endsWith("```")
    ){

      const code =
        part
          .replace(
            /^```[^\n]*\n?/,
            ""
          )
          .replace(
            /```$/,
            ""
          );

      const pre =
        document.createElement(
          "pre"
        );

      const codeElement =
        document.createElement(
          "code"
        );

      codeElement.textContent =
        code;

      pre.appendChild(
        codeElement
      );

      replyElement.appendChild(
        pre
      );

    }else if(
      part.trim()
    ){

      const span =
        document.createElement(
          "span"
        );

      span.textContent =
        part;

      replyElement.appendChild(
        span
      );
    }
  }
}


async function authenticate(){

  const {
    data:{
      session
    }
  } =
    await auraClient
      .auth
      .getSession();

  if(session){
    return session;
  }

  const {
    data,
    error
  } =
    await auraClient
      .auth
      .signInAnonymously();

  if(error){

    setStatus(
      "Authentication failed"
    );

    addLog(
      "ERROR",
      error.message
    );

    return null;
  }

  return data.session;
}


async function speak(
  text
){

  if(!text){
    return;
  }

  speaking=true;

  setStatus(
    "Speaking",
    true
  );

  try{

    const {
      data:{
        session
      }
    } =
      await auraClient
        .auth
        .getSession();

    if(!session){
      throw new Error(
        "No authenticated session."
      );
    }

    const response =
      await fetch(
        VOICE_FUNCTION,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              session.access_token
          },

          body:JSON.stringify({

            text,

            voiceId:
              voiceSelect.value

          })
        }
      );

    if(!response.ok){

      let message =
        "ElevenLabs request failed.";

      try{

        const data =
          await response.json();

        if(data.error){
          message =
            data.error;
        }

      }catch(_){}

      throw new Error(
        message
      );
    }

    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(
        blob
      );

    const audio =
      new Audio(url);

    audio.preload="auto";

    await new Promise(
      (resolve,reject)=>{

        audio.onended=resolve;
        audio.onerror=reject;

        audio
          .play()
          .catch(reject);
      }
    );

    URL.revokeObjectURL(
      url
    );

  }catch(error){

    addLog(
      "VOICE",
      error.message
    );

    /*
     * No automatic browser TTS fallback.
     * That was causing unnecessary delays.
     */

  }finally{

    speaking=false;

    if(
      constantListening
    ){

      setStatus(
        "Listening",
        true
      );

      setTimeout(
        startRecognition,
        200
      );

    }else{

      setStatus(
        "Ready"
      );
    }
  }
}


async function askAura(
  message
){

  if(
    busy ||
    !message
  ){
    return;
  }

  busy=true;
  waitingForCommand=false;

  clearTimeout(
    wakeTimer
  );

  try{
    recognition.stop();
  }catch(_){}

  setStatus(
    "Thinking",
    true
  );

  heardElement.textContent =
    "You: " +
    message;

  replyElement.textContent="";

  addLog(
    "YOU",
    message
  );

  try{

    const {
      data:{
        session
      }
    } =
      await auraClient
        .auth
        .getSession();

    if(!session){
      throw new Error(
        "No authenticated session."
      );
    }

    const response =
      await fetch(
        AURA_FUNCTION,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              session.access_token
          },

          body:JSON.stringify({
            message
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "AURA request failed."
      );
    }

    renderResponse(
      data.text
    );

    addLog(
      "AURA",
      data.text
    );

    await speak(
      data.spoken ||
      data.text
    );

  }catch(error){

    setStatus(
      "Error"
    );

    replyElement.textContent =
      error.message;

    addLog(
      "ERROR",
      error.message
    );

  }finally{

    busy=false;

    if(
      constantListening &&
      !speaking
    ){

      setTimeout(
        startRecognition,
        250
      );
    }
  }
}


function wakeDetected(
  command
){

  waitingForCommand=true;

  clearTimeout(
    wakeTimer
  );

  setStatus(
    "Listening",
    true
  );

  heardElement.textContent =
    "AURA is listening…";

  if(command){

    askAura(
      command
    );

    return;
  }

  wakeTimer =
    setTimeout(
      ()=>{
        if(
          waitingForCommand &&
          !busy
        ){

          waitingForCommand=false;

          heardElement.textContent =
            "Still listening…";
        }
      },
      2500
    );
}


function processSpeech(
  text,
  isFinal
){

  if(
    !text ||
    speaking ||
    busy ||
    !isFinal
  ){
    return;
  }

  const normalized =
    text.trim();

  if(
    waitingForCommand &&
    !/^(?:hey|yo|okay|ok)?\s*aura\b/i
      .test(normalized)
  ){

    wakeDetected(
      normalized
    );

    return;
  }

  const match =
    normalized.match(
      /^(?:(?:hey|yo|okay|ok)\s+)?aura\b[\s,:-]*(.*)$/i
    );

  if(!match){
    return;
  }

  wakeDetected(
    match[1].trim()
  );
}


function startRecognition(){

  if(
    !constantListening ||
    !recognition ||
    busy ||
    speaking
  ){
    return;
  }

  try{
    recognition.start();
  }catch(_){}
}


if(!SpeechRecognition){

  setStatus(
    "Speech recognition unavailable"
  );

  listenButton.disabled=true;

}else{

  recognition =
    new SpeechRecognition();

  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.lang="en-US";

  recognition.onstart=()=>{
    setStatus(
      "Listening",
      true
    );
  };

  recognition.onresult=
    event=>{

      let finalText="";
      let interimText="";

      for(
        let i=event.resultIndex;
        i<event.results.length;
        i++
      ){

        const result =
          event.results[i];

        if(
          result.isFinal
        ){

          finalText +=
            result[0]
              .transcript;

        }else{

          interimText +=
            result[0]
              .transcript;
        }
      }

      if(
        interimText &&
        !busy &&
        !speaking
      ){

        heardElement.textContent =
          interimText;
      }

      if(finalText){

        processSpeech(
          finalText,
          true
        );
      }
    };

  recognition.onerror =
    event=>{

      if(
        event.error==="not-allowed" ||
        event.error==="service-not-allowed"
      ){

        constantListening=false;

        listenButton.textContent =
          "CONSTANT LISTENING: OFF";

        listenButton.classList.remove(
          "active"
        );

        setStatus(
          "Microphone permission required"
        );

        return;
      }

      if(constantListening){

        setTimeout(
          startRecognition,
          500
        );
      }
    };

  recognition.onend=()=>{

    if(
      constantListening &&
      !busy &&
      !speaking
    ){

      setTimeout(
        startRecognition,
        200
      );
    }
  };
}


listenButton.onclick =
  async()=>{

    if(!constantListening){

      const session =
        await authenticate();

      if(!session){
        return;
      }

      constantListening=true;

      listenButton.textContent =
        "CONSTANT LISTENING: ON";

      listenButton.classList.add(
        "active"
      );

      setStatus(
        "Listening",
        true
      );

      startRecognition();

    }else{

      constantListening=false;
      waitingForCommand=false;

      clearTimeout(
        wakeTimer
      );

      try{
        recognition.stop();
      }catch(_){}

      speaking=false;

      listenButton.textContent =
        "CONSTANT LISTENING: OFF";

      listenButton.classList.remove(
        "active"
      );

      setStatus(
        "Ready"
      );
    }
  };


authenticate();

</script>

</body>
</html>
