<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0e0e">
<title>A.U.R.A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0e0e0e;
  --surface: #161616;
  --border: #242424;
  --text: #d8d8d8;
  --muted: #555;
  --dim: #333;
  --green: #5a9e6f;
  --red: #a05050;
  --f: 'Didact Gothic', sans-serif;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--f);
}

body {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: 100vh;
}

aside {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  gap: 24px;
}

.wordmark {
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--muted);
  text-transform: uppercase;
}

.section { display: flex; flex-direction: column; gap: 8px; }

.label {
  font-size: 10px;
  letter-spacing: .1em;
  color: var(--muted);
  text-transform: uppercase;
}

input, select, button { font-family: var(--f); }

.field {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-size: 12px;
  padding: 7px 9px;
  width: 100%;
  outline: none;
}
.field::placeholder { color: var(--dim); }
.field:focus { border-color: var(--muted); }

.project-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.project-select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-size: 12px;
  padding: 7px 9px;
  flex: 1;
  outline: none;
  cursor: pointer;
}
.project-select option { background: #161616; }
.project-select:disabled { opacity: .4; cursor: default; }

.pip {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dim);
  flex-shrink: 0;
  transition: background .3s;
}
.pip.live { background: var(--green); }
.pip.err  { background: var(--red); }

.btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--muted);
  font-size: 11px;
  padding: 7px 10px;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: color .15s, border-color .15s;
  letter-spacing: .04em;
}
.btn:hover { color: var(--text); border-color: var(--muted); }
.btn.on { color: var(--text); border-color: var(--dim); }
.btn:disabled { opacity: .3; cursor: default; }

.conn-note {
  font-size: 11px;
  color: var(--dim);
  line-height: 1.5;
}

aside .bottom {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

select.voice-sel {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-size: 11px;
  font-family: var(--f);
  padding: 6px 8px;
  width: 100%;
  outline: none;
  cursor: pointer;
}
select.voice-sel option { background: #161616; }

main {
  display: flex;
  flex-direction: column;
  padding: 40px 52px;
  max-width: 740px;
  width: 100%;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 48px;
}

.status-text {
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--muted);
}

.mic-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--muted);
  font-size: 11px;
  font-family: var(--f);
  letter-spacing: .06em;
  padding: 7px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color .15s, border-color .15s;
}
.mic-btn:hover { color: var(--text); border-color: var(--muted); }
.mic-btn.on { color: var(--text); border-color: var(--dim); }
.mic-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.heard {
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 28px;
  min-height: 18px;
  letter-spacing: .01em;
}

.reply {
  font-size: 18px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-width: 580px;
}

.reply pre {
  margin-top: 16px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, monospace;
  overflow-x: auto;
  color: var(--muted);
  white-space: pre;
}

.idle { font-size: 14px; color: var(--dim); }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<aside>
  <div class="wordmark">AURA</div>

  <div class="section">
    <div class="label">Access token</div>
    <input class="field" id="patInput" type="text" placeholder="sbp_…" autocomplete="off" spellcheck="false">
    <button class="btn" id="loadBtn">Load projects</button>
    <div class="conn-note" id="connNote">Enter a Supabase personal access token to connect.</div>
  </div>

  <div class="section">
    <div class="label">Project</div>
    <div class="project-row">
      <span class="pip" id="pip"></span>
      <select class="project-select" id="projectSelect" disabled>
        <option value="">— none —</option>
      </select>
    </div>
  </div>

  <div class="bottom">
    <div class="label">Voice</div>
    <select class="voice-sel" id="voiceSelect"></select>
    <button class="btn" id="autoBtn">Auto pitch: on</button>
  </div>
</aside>

<main>
  <div class="top-bar">
    <span class="status-text" id="statusText">Ready</span>
    <button class="mic-btn" id="micBtn">
      <svg viewBox="0 0 24 24">
        <rect x="9" y="2" width="6" height="13" rx="3"/>
        <path d="M5 10a7 7 0 0014 0"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      Mic off
    </button>
  </div>

  <div class="heard" id="heard"></div>

  <div class="reply" id="reply">
    <span class="idle">Connect a project and turn on the mic.</span>
  </div>
</main>

<script>
const SB_MGMT = "https://api.supabase.com";

let pat = localStorage.getItem("aura_pat") || "";
let projects = [];
let activeProject = null;
let auraUrl = "";
let auraKey = "";
let connected = false;

let recognition = null;
let listening = false;
let waiting = true;
let busy = false;
let speaking = false;
let wakeTimer = null;

let autoPitchOn = true;
let voices = [];
const conversation = [];
const prefs = { rate: .94, pitch: .98, volume: 1 };

const $pat     = document.getElementById("patInput");
const $loadBtn = document.getElementById("loadBtn");
const $note    = document.getElementById("connNote");
const $projSel = document.getElementById("projectSelect");
const $pip     = document.getElementById("pip");
const $status  = document.getElementById("statusText");
const $heard   = document.getElementById("heard");
const $reply   = document.getElementById("reply");
const $micBtn  = document.getElementById("micBtn");
const $autoBtn = document.getElementById("autoBtn");
const $voiceSel= document.getElementById("voiceSelect");

if (pat) $pat.value = pat;

function setPip(state) {
  $pip.className = "pip" + (state === "live" ? " live" : state === "err" ? " err" : "");
}

function setStatus(txt) { $status.textContent = txt; }

function setNote(txt) { $note.textContent = txt; }

async function mgmt(path) {
  const r = await fetch(SB_MGMT + path, {
    headers: { Authorization: "Bearer " + pat }
  });
  if (!r.ok) throw new Error("Management API " + r.status);
  return r.json();
}

$loadBtn.onclick = async () => {
  pat = $pat.value.trim();
  if (!pat) { setNote("Paste your personal access token first."); return; }
  localStorage.setItem("aura_pat", pat);

  $loadBtn.disabled = true;
  $loadBtn.textContent = "Loading…";
  setNote("");
  setPip("");

  try {
    projects = await mgmt("/v1/projects");
    $projSel.innerHTML = '<option value="">— select —</option>';
    projects.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = p.name;
      $projSel.appendChild(opt);
    });
    $projSel.disabled = false;
    setNote(projects.length + " project" + (projects.length !== 1 ? "s" : "") + " loaded.");
    const saved = localStorage.getItem("aura_project");
    if (saved && projects.find(p => p.id === saved)) {
      $projSel.value = saved;
      await activateProject(saved);
    }
  } catch(e) {
    setNote("Could not load projects. Check your token.");
    setPip("err");
  }

  $loadBtn.disabled = false;
  $loadBtn.textContent = "Load projects";
};

async function activateProject(id) {
  if (!id) { setPip(""); connected = false; return; }
  setPip("");
  setNote("Connecting…");

  try {
    const detail = await mgmt("/v1/projects/" + id);
    const keysData = await mgmt("/v1/projects/" + id + "/api-keys");
    const anonKey = (keysData || []).find(k => k.name === "anon")?.api_key || "";

    if (!anonKey) throw new Error("No anon key found");

    activeProject = detail;
    auraUrl = "https://" + detail.id + ".supabase.co/functions/v1/aura-v3";
    auraKey = anonKey;

    const probe = await fetch(auraUrl, {
      method: "OPTIONS",
      headers: { apikey: auraKey }
    });

    if (probe.ok || probe.status === 204 || probe.status === 200) {
      connected = true;
      setPip("live");
      setNote(detail.name);
      localStorage.setItem("aura_project", id);
    } else {
      throw new Error("Edge function unreachable (status " + probe.status + ")");
    }
  } catch(e) {
    connected = false;
    setPip("err");
    setNote(e.message);
  }
}

$projSel.onchange = () => activateProject($projSel.value);

function render(text) {
  $reply.textContent = "";
  const parts = String(text).split(/(```[\s\S]*?```)/g);
  for (const part of parts) {
    if (part.startsWith("```") && part.endsWith("```")) {
      const pre = document.createElement("pre");
      pre.textContent = part.replace(/^```[^\n]*\n?/, "").replace(/```$/, "");
      $reply.appendChild(pre);
    } else if (part.trim()) {
      const span = document.createElement("span");
      span.textContent = part;
      $reply.appendChild(span);
    }
  }
}

function toSpeech(text) {
  return String(text)
    .replace(/```[\s\S]*?```/g, "I've displayed the code.")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/[*_~`#>]/g, "")
    .replace(/\b(API|JSON|HTML|CSS|URL|SQL|JWT|UUID)\b/gi, m => m.split("").join(" "))
    .replace(/—/g, ", ")
    .replace(/\s+/g, " ")
    .trim();
}

function speak(text, autoPitchData) {
  return new Promise(resolve => {
    const clean = toSpeech(text);
    if (!clean) { resolve(); return; }
    speechSynthesis.cancel();

    const utt = new SpeechSynthesisUtterance(clean);
    const all = speechSynthesis.getVoices();
    const idx = Number($voiceSel.value);
    if (Number.isInteger(idx) && all[idx]) utt.voice = all[idx];

    let { rate, pitch, volume } = prefs;
    if (autoPitchOn && autoPitchData) {
      if (isFinite(+autoPitchData.rate))   rate   = Math.min(1.15, Math.max(.75, +autoPitchData.rate));
      if (isFinite(+autoPitchData.pitch))  pitch  = Math.min(1.40, Math.max(.60, +autoPitchData.pitch));
      if (isFinite(+autoPitchData.volume)) volume = Math.min(1,    Math.max(.70, +autoPitchData.volume));
    }
    utt.rate = rate; utt.pitch = pitch; utt.volume = volume;

    speaking = true;
    setStatus("Speaking");
    utt.onend = utt.onerror = () => { speaking = false; resolve(); };
    speechSynthesis.speak(utt);
  });
}

async function ask(text) {
  if (busy || speaking || !text.trim()) return;
  if (!auraUrl || !auraKey) {
    $reply.textContent = "No project connected.";
    return;
  }

  busy = true;
  waiting = false;
  clearTimeout(wakeTimer);
  try { recognition?.stop(); } catch(_) {}

  setStatus("Thinking");
  $heard.textContent = text;
  $reply.innerHTML = "";

  try {
    const res = await fetch(auraUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: auraKey },
      body: JSON.stringify({ message: text, history: conversation.slice(-12), preferences: prefs }),
    });

    let data;
    try { data = await res.json(); } catch(_) { throw new Error("Bad response."); }
    if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
    if (!data.text) throw new Error("Empty response.");

    conversation.push({ role: "user", content: text }, { role: "assistant", content: data.text });
    if (conversation.length > 24) conversation.splice(0, conversation.length - 24);

    render(data.text);
    await speak(data.spoken || data.text, data.pitch);

  } catch(e) {
    $reply.textContent = e.message;
    setStatus("Error");
    setPip("err");
  } finally {
    busy = false;
    if (connected) setPip("live");
    if (listening && !speaking) {
      waiting = true;
      setStatus("Listening");
      setTimeout(startListening, 200);
    } else {
      setStatus("Ready");
    }
  }
}

function onSpeech(text) {
  text = text.trim();
  if (!text || busy || speaking) return;
  if (!waiting) { ask(text); return; }

  const m = text.match(/^(?:(?:hey|ok|okay|yo)\s+)?aura\b[\s,:-]*(.*)?$/i);
  if (!m) return;

  waiting = false;
  const cmd = (m[1] || "").trim();
  if (cmd) { ask(cmd); return; }

  $heard.textContent = "Listening…";
  setStatus("Listening");
  clearTimeout(wakeTimer);
  wakeTimer = setTimeout(() => {
    if (!busy && !speaking) {
      waiting = true;
      $heard.textContent = "";
    }
  }, 5000);
}

const Recog = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Recog) {
  recognition = new Recog();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  recognition.onresult = e => {
    let fin = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      e.results[i].isFinal ? (fin += e.results[i][0].transcript) : (interim += e.results[i][0].transcript);
    }
    if (interim && !busy && !speaking) $heard.textContent = interim;
    if (fin) onSpeech(fin);
  };

  recognition.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false;
      updateMicBtn();
      setStatus("Mic permission denied");
      return;
    }
    if (listening) setTimeout(startListening, 500);
  };

  recognition.onend = () => {
    if (listening && !busy && !speaking) setTimeout(startListening, 200);
  };
} else {
  $micBtn.disabled = true;
  $micBtn.lastChild.textContent = " Not supported";
}

function startListening() {
  if (!recognition || !listening || busy || speaking) return;
  try { recognition.start(); } catch(e) {
    if (!String(e.message).includes("already started")) {
      setTimeout(() => { if (listening && !busy && !speaking) startListening(); }, 300);
    }
  }
}

function updateMicBtn() {
  $micBtn.classList.toggle("on", listening);
  $micBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Mic ${listening ? "on" : "off"}`;
}

$micBtn.onclick = () => {
  listening = !listening;
  waiting = true;
  updateMicBtn();
  if (listening) {
    setStatus("Listening");
    $heard.textContent = "";
    startListening();
  } else {
    speechSynthesis.cancel();
    clearTimeout(wakeTimer);
    try { recognition?.stop(); } catch(_) {}
    setStatus("Ready");
    $heard.textContent = "";
  }
};

$autoBtn.onclick = () => {
  autoPitchOn = !autoPitchOn;
  $autoBtn.textContent = "Auto pitch: " + (autoPitchOn ? "on" : "off");
  $autoBtn.classList.toggle("on", autoPitchOn);
};
$autoBtn.classList.add("on");

function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v?.name);
  $voiceSel.innerHTML = "";
  const en = voices.filter(v => /^en/i.test(v.lang));
  const list = en.length ? en : voices;
  if (!list.length) { $voiceSel.innerHTML = '<option>No voices</option>'; return; }
  list.forEach(v => {
    const o = document.createElement("option");
    o.value = String(voices.indexOf(v));
    o.textContent = v.name;
    $voiceSel.appendChild(o);
  });
  const pref = list.findIndex(v => /zira|google us english/i.test(v.name));
  if (pref >= 0) $voiceSel.value = String(voices.indexOf(list[pref]));
}
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 400);
setTimeout(loadVoices, 1200);

if (pat) {
  setTimeout(() => $loadBtn.click(), 300);
}
</script>
</body>
</html>
